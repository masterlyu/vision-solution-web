  <text x="650" y="140" text-anchor="middle" font-size="13" fill="#6b7280">GitHub 코드 공개</text>
  <text x="650" y="158" text-anchor="middle" font-size="11" fill="#9ca3af">github.com/deepseek-ai</text>
