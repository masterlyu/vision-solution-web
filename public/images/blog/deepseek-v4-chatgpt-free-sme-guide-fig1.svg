<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">DeepSeek V4 — 웹·API·오픈소스 핵심 비교</text>
  <!-- 카드 1: 웹 무료 -->
  <rect x="40" y="64" width="220" height="110" rx="12" fill="#ecfdf5"/>
  <text x="150" y="118" text-anchor="middle" font-size="30" font-weight="900" fill="#0f766e">무료</text>
  <text x="150" y="148" text-anchor="middle" font-size="13" fill="#6b7280">웹 인터페이스</text>
  <text x="150" y="165" text-anchor="middle" font-size="11" fill="#9ca3af">chat.deepseek.com</text>
  <!-- 카드 2: API 비용 -->
  <rect x="290" y="64" width="220" height="110" rx="12" fill="#eff6ff"/>
  <text x="400" y="112" text-anchor="middle" font-size="30" font-weight="900" fill="#2563eb">약 1/10</text>
  <text x="400" y="140" text-anchor="middle" font-size="13" fill="#6b7280">GPT-4o API 대비 비용</text>
  <text x="400" y="158" text-anchor="middle" font-size="11" fill="#9ca3af">platform.deepseek.com</text>
