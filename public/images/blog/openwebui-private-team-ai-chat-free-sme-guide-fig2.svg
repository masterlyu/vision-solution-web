  <!-- 화살표 -->
  <text x="525" y="122" text-anchor="middle" font-size="28" fill="#94a3b8">→</text>
  <!-- 단계 3 -->
  <rect x="550" y="65" width="210" height="95" rx="12" fill="#22d3ee"/>
  <text x="655" y="107" text-anchor="middle" font-size="16" font-weight="800" fill="#083344">③ AI 모델 연결</text>
  <text x="655" y="133" text-anchor="middle" font-size="12" fill="#083344">Ollama 또는 API 키</text>
</svg>
