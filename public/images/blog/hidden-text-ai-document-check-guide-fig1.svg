<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">숨은 지시문이 AI에 전달되는 과정</text>
  <rect x="40" y="70" width="200" height="90" rx="12" fill="#0f766e"/>
  <text x="140" y="112" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">① 흰 글씨 삽입</text>
  <text x="140" y="138" text-anchor="middle" font-size="12" fill="#a7f3d0">사람 눈에는 안 보임</text>
  <text x="265" y="122" text-anchor="middle" font-size="28" fill="#94a3b8">→</text>
  <rect x="300" y="70" width="200" height="90" rx="12" fill="#0891b2"/>
  <text x="400" y="112" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">② AI에 문서 업로드</text>
  <text x="400" y="138" text-anchor="middle" font-size="12" fill="#cffafe">글자 목록을 통째로 읽음</text>
  <text x="525" y="122" text-anchor="middle" font-size="28" fill="#94a3b8">→</text>
  <rect x="560" y="70" width="200" height="90" rx="12" fill="#22d3ee"/>
  <text x="660" y="112" text-anchor="middle" font-size="16" font-weight="800" fill="#083344">③ 지시를 따를 위험</text>
  <text x="660" y="138" text-anchor="middle" font-size="12" fill="#083344">요약·판단이 왜곡됨</text>
</svg>
