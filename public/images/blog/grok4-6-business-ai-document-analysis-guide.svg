  <text x="40" y="130" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="white" opacity="0.8">xAI · 2026년 8월 출시</text>
  <text x="40" y="180" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="34" font-weight="900" fill="white">Grok 4.6</text>
