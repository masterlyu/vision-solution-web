<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f766e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)" />
  <circle cx="700" cy="-50" r="200" fill="white" opacity="0.05"/>
  <circle cx="750" cy="420" r="150" fill="white" opacity="0.05"/>
  <!-- 태그 배지 -->
  <rect x="40" y="40" width="90" height="28" rx="14" fill="white" opacity="0.2"/>
  <text x="85" y="59" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="white">AI 활용</text>
  <!-- 우측 아이콘 카드 -->
  <rect x="480" y="60" width="280" height="300" rx="20" fill="url(#card1)" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <!-- 문서 아이콘 -->
  <rect x="570" y="110" width="100" height="130" rx="8" fill="white" opacity="0.25"/>
  <rect x="582" y="128" width="76" height="6" rx="3" fill="white" opacity="0.7"/>
  <rect x="582" y="142" width="60" height="6" rx="3" fill="white" opacity="0.7"/>
  <rect x="582" y="156" width="70" height="6" rx="3" fill="white" opacity="0.7"/>
  <rect x="582" y="170" width="50" height="6" rx="3" fill="white" opacity="0.7"/>
  <rect x="582" y="184" width="66" height="6" rx="3" fill="white" opacity="0.7"/>
  <rect x="582" y="198" width="55" height="6" rx="3" fill="white" opacity="0.7"/>
  <!-- 1위 뱃지 -->
  <circle cx="650" cy="260" r="26" fill="#fbbf24" opacity="0.95"/>
  <text x="650" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#1f2937">세계</text>
  <text x="650" y="273" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#1f2937">1위</text>
  <text x="620" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.7">Harvey LAB</text>
