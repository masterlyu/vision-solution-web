<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="240" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">세 가지가 한꺼번에 붙으면 위험합니다</text>
  <rect x="30" y="66" width="190" height="100" rx="12" fill="#f5f3ff" stroke="#c084fc" stroke-width="2"/>
  <text x="125" y="104" text-anchor="middle" font-size="15" font-weight="800" fill="#7c3aed">내 비밀 자료</text>
  <text x="125" y="130" text-anchor="middle" font-size="13" fill="#6b7280">볼 수 있는 권한</text>
  <text x="240" y="124" text-anchor="middle" font-size="26" font-weight="800" fill="#94a3b8">+</text>
  <rect x="260" y="66" width="190" height="100" rx="12" fill="#f5f3ff" stroke="#c084fc" stroke-width="2"/>
  <text x="355" y="104" text-anchor="middle" font-size="15" font-weight="800" fill="#7c3aed">믿을 수 없는 글</text>
  <text x="355" y="130" text-anchor="middle" font-size="13" fill="#6b7280">웹·메일·첨부파일 읽기</text>
  <text x="470" y="124" text-anchor="middle" font-size="26" font-weight="800" fill="#94a3b8">+</text>
  <rect x="490" y="66" width="150" height="100" rx="12" fill="#f5f3ff" stroke="#c084fc" stroke-width="2"/>
  <text x="565" y="104" text-anchor="middle" font-size="15" font-weight="800" fill="#7c3aed">바깥 전송</text>
  <text x="565" y="130" text-anchor="middle" font-size="13" fill="#6b7280">밖으로 보내는 길</text>
  <text x="660" y="124" text-anchor="middle" font-size="26" font-weight="800" fill="#94a3b8">=</text>
  <rect x="680" y="66" width="100" height="100" rx="12" fill="#7c3aed"/>
  <text x="730" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">자료</text>
  <text x="730" y="130" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">유출</text>
  <text x="40" y="200" font-size="14" fill="#1f2937">하나만 빼도 피해가 크게 줄어듭니다. 가장 쉬운 건 '바깥 전송' 권한을 주지 않는 것입니다.</text>
  <text x="40" y="226" font-size="11" fill="#6b7280">출처: Simon Willison, "The Lethal Trifecta"(2025-06-16) 번역·요약</text>
</svg>
