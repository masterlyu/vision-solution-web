<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">아침 보고가 자동으로 도착하는 흐름</text>
  <rect x="40" y="70" width="200" height="90" rx="12" fill="#0f766e"/>
  <text x="140" y="112" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">① 말로 예약</text>
  <text x="140" y="138" text-anchor="middle" font-size="12" fill="#a7f3d0">"매일 아침 9시에…"</text>
  <text x="265" y="122" text-anchor="middle" font-size="28" fill="#94a3b8">→</text>
  <rect x="300" y="70" width="200" height="90" rx="12" fill="#0891b2"/>
  <text x="400" y="112" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">② 정해진 시각 실행</text>
  <text x="400" y="138" text-anchor="middle" font-size="12" fill="#cffafe">위험 명령은 자동 거부</text>
  <text x="525" y="122" text-anchor="middle" font-size="28" fill="#94a3b8">→</text>
  <rect x="560" y="70" width="200" height="90" rx="12" fill="#22d3ee"/>
  <text x="660" y="112" text-anchor="middle" font-size="16" font-weight="800" fill="#083344">③ 텔레그램 도착</text>
  <text x="660" y="138" text-anchor="middle" font-size="12" fill="#083344">요약을 확인만 하면 끝</text>
</svg>
