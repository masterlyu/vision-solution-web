<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="260" fill="#ffffff"/>
  <text x="40" y="44" font-size="20" font-weight="800" fill="#1f2937">'모두의 AI' 프로젝트 타임라인</text>
  <line x1="80" y1="150" x2="720" y2="150" stroke="#cbd5e1" stroke-width="3"/>
  <!-- 첫 번째 마디 -->
  <circle cx="120" cy="150" r="10" fill="#0f766e"/>
  <text x="120" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">2026.09.04</text>
  <text x="120" y="185" text-anchor="middle" font-size="12" fill="#6b7280">정부·SKT·KT</text>
  <text x="120" y="203" text-anchor="middle" font-size="12" fill="#6b7280">카카오 공동 선언</text>
  <!-- 두 번째 마디 -->
  <circle cx="400" cy="150" r="10" fill="#0891b2"/>
  <text x="400" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">2026년 하반기</text>
  <text x="400" y="185" text-anchor="middle" font-size="12" fill="#6b7280">인프라 구축</text>
  <text x="400" y="203" text-anchor="middle" font-size="12" fill="#6b7280">서비스 준비</text>
  <!-- 세 번째 마디 (미래) -->
  <circle cx="680" cy="150" r="10" fill="#22d3ee" stroke="#0891b2" stroke-width="2"/>
  <text x="680" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">2026년 내</text>
  <text x="680" y="185" text-anchor="middle" font-size="12" fill="#6b7280">전 국민 무료</text>
  <text x="680" y="203" text-anchor="middle" font-size="12" fill="#0891b2">N에이전트 출시 예정</text>
