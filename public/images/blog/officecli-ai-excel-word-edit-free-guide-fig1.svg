<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">OfficeCLI 핵심 지표 (2026-07-10 기준)</text>
  <!-- 카드 1: GitHub Stars -->
  <rect x="40" y="64" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="150" y="115" text-anchor="middle" font-size="34" font-weight="900" fill="#0f766e">13,808</text>
  <text x="150" y="148" text-anchor="middle" font-size="13" fill="#6b7280">GitHub 별 (⭐)</text>
  <!-- 카드 2: 지원 형식 -->
  <rect x="290" y="64" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="400" y="115" text-anchor="middle" font-size="34" font-weight="900" fill="#0f766e">3가지</text>
  <text x="400" y="148" text-anchor="middle" font-size="13" fill="#6b7280">.docx · .xlsx · .pptx</text>
  <!-- 카드 3: Excel 함수 -->
  <rect x="540" y="64" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="650" y="115" text-anchor="middle" font-size="34" font-weight="900" fill="#0f766e">350+</text>
  <text x="650" y="148" text-anchor="middle" font-size="13" fill="#6b7280">Excel 함수 자동 지원</text>
</svg>
