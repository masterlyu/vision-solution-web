<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">Cerebras 무료 플랜 핵심 수치</text>

  <!-- 카드 1: 14배 빠름 -->
  <rect x="40" y="64" width="220" height="110" rx="12" fill="#ecfdf5"/>
  <text x="150" y="122" text-anchor="middle" font-size="40" font-weight="900" fill="#0f766e">14배</text>
  <text x="150" y="152" text-anchor="middle" font-size="13" fill="#6b7280">ChatGPT Ultrafast 모드 대비</text>

  <!-- 카드 2: 100만 토큰 무료 -->
  <rect x="290" y="64" width="220" height="110" rx="12" fill="#ecfdf5"/>
  <text x="400" y="118" text-anchor="middle" font-size="30" font-weight="900" fill="#0f766e">100만</text>
  <text x="400" y="145" text-anchor="middle" font-size="14" fill="#0f766e">토큰/일 무료</text>
  <text x="400" y="163" text-anchor="middle" font-size="12" fill="#6b7280">신용카드 불필요</text>

  <!-- 카드 3: $0.50/M 초과 -->
  <rect x="540" y="64" width="220" height="110" rx="12" fill="#ecfdf5"/>
  <text x="650" y="118" text-anchor="middle" font-size="30" font-weight="900" fill="#0f766e">$0.50</text>
  <text x="650" y="145" text-anchor="middle" font-size="14" fill="#0f766e">/ 백만 토큰</text>
  <text x="650" y="163" text-anchor="middle" font-size="12" fill="#6b7280">초과 사용 시 추가 요금</text>
</svg>
