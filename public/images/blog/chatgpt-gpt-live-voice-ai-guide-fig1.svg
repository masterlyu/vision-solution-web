<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="300" fill="#ffffff"/>
  <text x="40" y="44" font-size="20" font-weight="800" fill="#1f2937">기존 음성 AI vs GPT-Live — 무엇이 다른가</text>
  <!-- 기존 방식 막대 -->
  <rect x="120" y="80" width="160" height="160" rx="6" fill="#e2e8f0"/>
  <text x="200" y="140" text-anchor="middle" font-size="36" fill="#94a3b8">📻</text>
  <text x="200" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">기존 음성 AI</text>
  <text x="200" y="198" text-anchor="middle" font-size="12" fill="#94a3b8">워키토키 방식</text>
  <text x="200" y="218" text-anchor="middle" font-size="12" fill="#94a3b8">내가 다 말해야 응답</text>
  <text x="200" y="257" text-anchor="middle" font-size="13" fill="#64748b">말 끊기 ❌</text>
  <!-- 화살표 -->
  <text x="400" y="168" text-anchor="middle" font-size="36" fill="#cbd5e1">→</text>
  <!-- GPT-Live 막대 -->
  <rect x="500" y="60" width="180" height="180" rx="6" fill="#0f766e"/>
  <text x="590" y="130" text-anchor="middle" font-size="36" fill="#ffffff">📱</text>
  <text x="590" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">GPT-Live</text>
  <text x="590" y="190" text-anchor="middle" font-size="12" fill="#a7f3d0">전화 통화 방식</text>
  <text x="590" y="210" text-anchor="middle" font-size="12" fill="#a7f3d0">동시에 듣고 말함</text>
  <text x="590" y="257" text-anchor="middle" font-size="13" fill="#0f766e">말 끊기 ✅</text>
</svg>
