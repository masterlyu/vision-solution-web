<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f766e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)" />
  <circle cx="700" cy="-50" r="200" fill="white" opacity="0.05"/>
  <circle cx="750" cy="420" r="150" fill="white" opacity="0.05"/>
  <!-- 태그 배지 -->
  <rect x="40" y="40" width="100" height="28" rx="14" fill="white" opacity="0.2"/>
  <text x="90" y="59" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="white">AI 활용</text>
  <!-- 우측 카드 -->
  <rect x="480" y="55" width="285" height="310" rx="20" fill="url(#card1)" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <!-- 문서 아이콘들 -->
  <text x="620" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" fill="white" opacity="0.9">🗂️</text>
  <rect x="510" y="185" width="220" height="1" fill="white" opacity="0.2"/>
  <!-- 기능 태그 -->
  <rect x="520" y="200" width="90" height="22" rx="11" fill="white" opacity="0.15"/>
  <text x="565" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" opacity="0.9">PDF · Word</text>
  <rect x="622" y="200" width="90" height="22" rx="11" fill="white" opacity="0.15"/>
  <text x="667" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" opacity="0.9">Excel · PPT</text>
  <!-- 별 카운트 -->
  <text x="545" y="255" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.7">⭐ GitHub 6만+ 스타</text>
  <text x="545" y="278" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.7">🔒 완전 로컬 · 무료 · MIT</text>
  <text x="545" y="301" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.7">🖥️ Windows / Mac / Linux</text>
  <text x="545" y="330" font-family="Arial, sans-serif" font-size="12" fill="white" opacity="0.5">anythingllm.com</text>
  <!-- 좌측 메인 텍스트 -->
  <text x="40" y="130" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="white" opacity="0.8">무료 오픈소스 AI</text>
  <text x="40" y="180" font-family="Arial, sans-serif" font-size="33" font-weight="900" fill="white">회사 문서를</text>
  <text x="40" y="220" font-family="Arial, sans-serif" font-size="33" font-weight="900" fill="white">AI로 대화하기</text>
  <text x="40" y="265" font-family="Arial, sans-serif" font-size="15" fill="white" opacity="0.75">PDF·엑셀·워드를 올려두고 바로 질문하세요</text>
  <text x="40" y="292" font-family="Arial, sans-serif" font-size="15" fill="white" opacity="0.75">데이터는 내 PC 밖으로 나가지 않습니다</text>
  <rect x="40" y="320" width="60" height="4" rx="2" fill="white" opacity="0.6"/>
  <text x="40" y="355" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.6">(주)비젼솔루션</text>
