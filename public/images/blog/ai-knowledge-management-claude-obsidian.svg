<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4338ca;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)" />
  <circle cx="700" cy="-40" r="200" fill="white" opacity="0.05"/>
  <circle cx="760" cy="440" r="160" fill="white" opacity="0.05"/>
  <!-- 태그 배지 -->
  <rect x="40" y="40" width="90" height="28" rx="14" fill="white" opacity="0.2"/>
  <text x="85" y="59" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="white">AI 활용</text>
  <!-- 우측 정보 카드 -->
  <rect x="490" y="60" width="270" height="300" rx="20" fill="url(#card1)" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <!-- MIT 배지 -->
  <rect x="535" y="95" width="70" height="28" rx="8" fill="white" opacity="0.25"/>
  <text x="570" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="white">MIT</text>
  <!-- GitHub 별 -->
  <text x="625" y="195" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="white" text-anchor="middle">직원이 퇴사해도 회사</text>
  <text x="625" y="231" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="white" text-anchor="middle">노하우가 사라지지 않는</text>
  <text x="625" y="267" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="white" text-anchor="middle">AI — 무료로 만들었습니다</text>
  <text x="40" y="315" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.75">Obsidian + Claude AI · 완전 무료 · 한국어 지원</text>
  <!-- 구분선 + 회사명 -->
  <rect x="40" y="345" width="60" height="4" rx="2" fill="white" opacity="0.6"/>
  <text x="40" y="378" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.6">(주)비젼솔루션</text>
</svg>
