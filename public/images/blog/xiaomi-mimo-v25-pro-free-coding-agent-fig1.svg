<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">MiMo V2.5-Pro 핵심 사양</text>
  <!-- 카드 1: MIT 라이선스 -->
  <rect x="40" y="58" width="220" height="115" rx="12" fill="#ecfdf5"/>
  <text x="150" y="112" text-anchor="middle" font-size="30" font-weight="900" fill="#059669">MIT</text>
  <text x="150" y="140" text-anchor="middle" font-size="13" fill="#6b7280">라이선스 — 무료 상업 이용</text>
  <text x="150" y="158" text-anchor="middle" font-size="12" fill="#9ca3af">수정·배포·판매 모두 허용</text>
  <!-- 카드 2: 100만 토큰 -->
  <rect x="290" y="58" width="220" height="115" rx="12" fill="#eff6ff"/>
  <text x="400" y="112" text-anchor="middle" font-size="30" font-weight="900" fill="#2563eb">100만</text>
  <text x="400" y="140" text-anchor="middle" font-size="13" fill="#6b7280">토큰 컨텍스트</text>
  <text x="400" y="158" text-anchor="middle" font-size="12" fill="#9ca3af">문서 750페이지 분량 처리</text>
  <!-- 카드 3: 무료 플랜 -->
  <rect x="540" y="58" width="220" height="115" rx="12" fill="#fff7ed"/>
  <text x="650" y="112" text-anchor="middle" font-size="30" font-weight="900" fill="#ea580c">$0</text>
  <text x="650" y="140" text-anchor="middle" font-size="13" fill="#6b7280">API 시작 비용</text>
  <text x="650" y="158" text-anchor="middle" font-size="12" fill="#9ca3af">무료 플랜으로 즉시 시작</text>
</svg>
