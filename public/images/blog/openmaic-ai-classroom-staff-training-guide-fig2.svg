<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">OpenMAIC 중소기업 활용 3가지 시나리오</text>
  <!-- 카드 1: 신입 온보딩 -->
  <rect x="40" y="60" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="150" y="103" text-anchor="middle" font-size="28">👋</text>
  <text x="150" y="130" text-anchor="middle" font-size="14" font-weight="800" fill="#0f766e">신입 직원 온보딩</text>
  <text x="150" y="152" text-anchor="middle" font-size="12" fill="#6b7280">업무 매뉴얼 → AI 강사</text>
  <!-- 카드 2: 영업 교육 -->
  <rect x="290" y="60" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="400" y="103" text-anchor="middle" font-size="28">💼</text>
  <text x="400" y="130" text-anchor="middle" font-size="14" font-weight="800" fill="#0891b2">영업 제품 교육</text>
  <text x="400" y="152" text-anchor="middle" font-size="12" fill="#6b7280">카탈로그 → AI 트레이너</text>
  <!-- 카드 3: 규정 교육 -->
  <rect x="540" y="60" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="650" y="103" text-anchor="middle" font-size="28">📋</text>
  <text x="650" y="130" text-anchor="middle" font-size="14" font-weight="800" fill="#0f766e">규정·컴플라이언스</text>
  <text x="650" y="152" text-anchor="middle" font-size="12" fill="#6b7280">규정집 → AI 퀴즈 강사</text>
</svg>
