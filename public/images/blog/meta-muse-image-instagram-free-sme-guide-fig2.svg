  <text x="140" y="130" text-anchor="middle" font-size="11" fill="#a7f3d0">인스타·왓츠앱·Meta AI</text>
  <!-- 화살표 -->
  <text x="265" y="122" text-anchor="middle" font-size="28" fill="#94a3b8">→</text>
  <!-- 단계 2 -->
  <rect x="300" y="70" width="200" height="90" rx="12" fill="#0891b2"/>
  <text x="400" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">② 설명 입력</text>
  <text x="400" y="130" text-anchor="middle" font-size="11" fill="#cffafe">제품·분위기·스타일 한 줄</text>
  <!-- 화살표 -->
  <text x="525" y="122" text-anchor="middle" font-size="28" fill="#94a3b8">→</text>
  <!-- 단계 3 -->
  <rect x="560" y="70" width="200" height="90" rx="12" fill="#22d3ee"/>
  <text x="660" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#083344">③ 저장·활용</text>
  <text x="660" y="130" text-anchor="middle" font-size="11" fill="#083344">피드·광고·스토리 바로 사용</text>
</svg>
