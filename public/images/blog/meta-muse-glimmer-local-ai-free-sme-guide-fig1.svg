<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">Muse Glimmer 핵심 수치</text>
  <!-- 카드 1: 구독료 -->
  <rect x="40" y="60" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="150" y="118" text-anchor="middle" font-size="40" font-weight="900" fill="#0f766e">0원</text>
  <text x="150" y="150" text-anchor="middle" font-size="14" fill="#6b7280">월 구독료</text>
  <!-- 카드 2: 파라미터 -->
  <rect x="290" y="60" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="400" y="118" text-anchor="middle" font-size="40" font-weight="900" fill="#0f766e">30B</text>
  <text x="400" y="150" text-anchor="middle" font-size="14" fill="#6b7280">파라미터 크기</text>
  <!-- 카드 3: 설치 시간 -->
  <rect x="540" y="60" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="650" y="118" text-anchor="middle" font-size="40" font-weight="900" fill="#0f766e">5분</text>
  <text x="650" y="150" text-anchor="middle" font-size="14" fill="#6b7280">LM Studio 설치 시간</text>
</svg>
