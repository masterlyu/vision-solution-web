<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="280" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">두 에이전트 역할 — 고객 vs 판매자</text>
  <!-- 왼쪽: 쇼핑 에이전트 -->
  <rect x="40" y="64" width="340" height="180" rx="14" fill="#0f766e"/>
  <text x="210" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#a7f3d0">고객용</text>
  <text x="210" y="126" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">🛍 쇼핑 에이전트</text>
  <text x="210" y="154" text-anchor="middle" font-size="13" fill="#ccfbf1">말로 요청 → 상품 검색·비교</text>
  <text x="210" y="176" text-anchor="middle" font-size="13" fill="#ccfbf1">장바구니 자동 담기</text>
  <text x="210" y="198" text-anchor="middle" font-size="13" fill="#ccfbf1">필터·페이지 이동 불필요</text>
  <text x="210" y="224" text-anchor="middle" font-size="12" fill="#99f6e4">→ 구매완료율 60% 상승</text>
  <!-- 오른쪽: 머천트 에이전트 -->
  <rect x="420" y="64" width="340" height="180" rx="14" fill="#0891b2"/>
  <text x="590" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#bae6fd">판매자용</text>
  <text x="590" y="126" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">📊 머천트 에이전트</text>
  <text x="590" y="154" text-anchor="middle" font-size="13" fill="#cffafe">재고 현황 자동 확인</text>
  <text x="590" y="176" text-anchor="middle" font-size="13" fill="#cffafe">가격 조정 제안</text>
  <text x="590" y="198" text-anchor="middle" font-size="13" fill="#cffafe">마케팅 문구 초안 생성</text>
  <text x="590" y="224" text-anchor="middle" font-size="12" fill="#a5f3fc">→ 장바구니 30~35% 증가</text>
</svg>
