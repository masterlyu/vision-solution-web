<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">OpenCut 핵심 수치</text>
  <!-- 카드 1: 완전 무료 -->
  <rect x="40" y="64" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="150" y="120" text-anchor="middle" font-size="36" font-weight="900" fill="#0f766e">0원</text>
  <text x="150" y="152" text-anchor="middle" font-size="14" fill="#6b7280">완전 무료 (유료 플랜 없음)</text>
  <!-- 카드 2: GitHub 스타 -->
  <rect x="290" y="64" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="400" y="120" text-anchor="middle" font-size="36" font-weight="900" fill="#0f766e">67K+</text>
  <text x="400" y="152" text-anchor="middle" font-size="14" fill="#6b7280">GitHub 스타 (2026.07 기준)</text>
  <!-- 카드 3: 워터마크 -->
  <rect x="540" y="64" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="650" y="120" text-anchor="middle" font-size="36" font-weight="900" fill="#0f766e">0개</text>
  <text x="650" y="152" text-anchor="middle" font-size="14" fill="#6b7280">워터마크 (무료 버전도 없음)</text>
</svg>
