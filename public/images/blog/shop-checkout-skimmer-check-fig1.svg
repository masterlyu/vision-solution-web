<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">쇼핑몰 결제 중 카드정보 탈취 사건, 한눈에</text>
  <rect x="40" y="64" width="220" height="110" rx="12" fill="#f5f3ff"/>
  <text x="150" y="118" text-anchor="middle" font-size="34" font-weight="900" fill="#7c3aed">5,707건</text>
  <text x="150" y="148" text-anchor="middle" font-size="14" fill="#6b7280">카드정보 탈취 정황</text>
  <rect x="290" y="64" width="220" height="110" rx="12" fill="#f5f3ff"/>
  <text x="400" y="118" text-anchor="middle" font-size="34" font-weight="900" fill="#7c3aed">6월 29일</text>
  <text x="400" y="148" text-anchor="middle" font-size="14" fill="#6b7280">금융보안원 확인 기준일</text>
  <rect x="540" y="64" width="220" height="110" rx="12" fill="#f5f3ff"/>
  <text x="650" y="118" text-anchor="middle" font-size="34" font-weight="900" fill="#7c3aed">7월 5일</text>
  <text x="650" y="148" text-anchor="middle" font-size="14" fill="#6b7280">금감원 소비자경보 '주의'</text>
</svg>
