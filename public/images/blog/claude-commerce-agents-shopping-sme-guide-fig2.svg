<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">Anthropic 파트너사 실측 성과 (2026년 9월)</text>
  <!-- 카드 1: 장바구니 증가 -->
  <rect x="40" y="60" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="150" y="118" text-anchor="middle" font-size="36" font-weight="900" fill="#0f766e">+30%</text>
  <text x="150" y="148" text-anchor="middle" font-size="13" fill="#6b7280">장바구니 크기 증가</text>
  <!-- 카드 2: 구매완료율 -->
  <rect x="290" y="60" width="220" height="110" rx="12" fill="#ecfeff"/>
  <text x="400" y="118" text-anchor="middle" font-size="36" font-weight="900" fill="#0891b2">+60%</text>
  <text x="400" y="148" text-anchor="middle" font-size="13" fill="#6b7280">구매 완료율 상승</text>
  <!-- 카드 3: 라이선스 -->
  <rect x="540" y="60" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="650" y="112" text-anchor="middle" font-size="22" font-weight="900" fill="#0f766e">Apache 2.0</text>
  <text x="650" y="138" text-anchor="middle" font-size="13" fill="#6b7280">무료 오픈소스</text>
  <text x="650" y="157" text-anchor="middle" font-size="12" fill="#9ca3af">상업 이용 허용</text>
</svg>
