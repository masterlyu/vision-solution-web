<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="300" fill="#ffffff"/>
  <text x="40" y="44" font-size="20" font-weight="800" fill="#1f2937">기존 LLM vs Jev — 판단 방식 비교</text>

  <!-- 왼쪽: 기존 LLM -->
  <rect x="40" y="68" width="330" height="200" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="205" y="97" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b">기존 LLM (ChatGPT 등)</text>
  <text x="205" y="128" text-anchor="middle" font-size="13" fill="#1f2937">입력: "이 이메일이 불만인가요?"</text>
  <!-- 화살표 아래 -->
  <text x="205" y="155" text-anchor="middle" font-size="18" fill="#94a3b8">▼</text>
  <rect x="80" y="165" width="250" height="40" rx="6" fill="#e2e8f0"/>
  <text x="205" y="190" text-anchor="middle" font-size="12" fill="#475569">단어를 하나씩 생성... (1~3초)</text>
  <text x="205" y="248" text-anchor="middle" font-size="12" fill="#64748b">"네, 이 이메일은 불만 문의로 보입니다."</text>

  <!-- 오른쪽: Jev/SemIf -->
  <rect x="430" y="68" width="330" height="200" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="595" y="97" text-anchor="middle" font-size="15" font-weight="700" fill="#059669">Jev / SemIf</text>
  <text x="595" y="128" text-anchor="middle" font-size="13" fill="#1f2937">입력: "이 이메일이 불만인가요?"</text>
  <!-- 화살표 아래 -->
  <text x="595" y="155" text-anchor="middle" font-size="18" fill="#34d399">▼</text>
  <rect x="470" y="165" width="250" height="40" rx="6" fill="#d1fae5"/>
  <text x="595" y="190" text-anchor="middle" font-size="12" fill="#065f46">확률값 즉시 계산 (0.07~0.5초)</text>
  <text x="595" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#059669">불만 0.94 / 문의 0.05 / 기타 0.01</text>

  <!-- 가운데 VS -->
  <text x="400" y="175" text-anchor="middle" font-size="22" font-weight="900" fill="#94a3b8">VS</text>
</svg>
