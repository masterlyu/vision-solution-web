<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f766e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)" />
  <circle cx="700" cy="-50" r="200" fill="white" opacity="0.05"/>
  <circle cx="750" cy="420" r="150" fill="white" opacity="0.05"/>
  <!-- 태그 배지 -->
  <rect x="40" y="40" width="80" height="28" rx="14" fill="white" opacity="0.2"/>
  <text x="80" y="59" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="white">AI 활용</text>
  <!-- 우측 아이콘 카드 -->
  <rect x="480" y="60" width="280" height="300" rx="20" fill="url(#card1)" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <text x="620" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" fill="white" opacity="0.9">🎬</text>
  <!-- 무료 도구 3가지 라벨 -->
  <rect x="510" y="200" width="220" height="28" rx="6" fill="white" opacity="0.15"/>
  <text x="620" y="219" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="white">Kling AI · Wan 2.6 · Luma</text>
  <text x="620" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.6">무료 · 오픈소스 · 상업 이용</text>
  <text x="620" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" opacity="0.4">9/24 종료 전 갈아타기</text>
  <!-- 좌측 메인 텍스트 -->
  <text x="40" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white" opacity="0.8">AI 영상 생성</text>
  <text x="40" y="178" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="white">소라 AI 종료 —</text>
  <text x="40" y="218" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="white">무료 영상 AI</text>
  <text x="40" y="258" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="white">대안 3가지</text>
  <text x="40" y="300" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.75">9월 24일 종료 전 지금 갈아타세요</text>
  <rect x="40" y="320" width="60" height="4" rx="2" fill="white" opacity="0.6"/>
  <text x="40" y="355" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.6">(주)비젼솔루션</text>
