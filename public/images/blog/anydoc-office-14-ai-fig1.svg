<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" font-family="Arial, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect width="800" height="260" fill="#ffffff"/>
  <text x="40" y="36" font-size="18" font-weight="800" fill="#1f2937">문서 변환 속도 비교</text>
  <text x="40" y="54" font-size="13" fill="#6b7280">100개 실제 문서 기준 중앙값 (낮을수록 빠름)</text>

  <!-- anydoc row -->
  <text x="158" y="96" text-anchor="end" font-size="14" font-weight="700" fill="#0f766e">anydoc</text>
  <rect x="168" y="78" width="12" height="30" rx="4" fill="#22d3ee"/>
  <text x="188" y="97" font-size="16" font-weight="900" fill="#0f766e">4.4ms</text>
  <rect x="290" y="80" width="130" height="26" rx="13" fill="#dcfce7"/>
  <text x="355" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">최대 256배 빠름 ✓</text>

  <!-- MarkItDown row -->
  <text x="158" y="152" text-anchor="end" font-size="14" font-weight="700" fill="#4b5563">MarkItDown</text>
  <text x="162" y="143" font-size="10" fill="#9ca3af">(Microsoft)</text>
  <rect x="168" y="134" width="155" height="30" rx="4" fill="#94a3b8"/>
  <text x="332" y="153" font-size="14" font-weight="700" fill="#4b5563">~123ms</text>

  <!-- Unstructured row -->
  <text x="158" y="208" text-anchor="end" font-size="14" font-weight="700" fill="#4b5563">Unstructured</text>
  <text x="162" y="199" font-size="10" fill="#9ca3af">(기업용)</text>
  <rect x="168" y="190" width="580" height="30" rx="4" fill="#e2e8f0"/>
  <text x="180" y="209" font-size="14" font-weight="700" fill="#4b5563">~537ms</text>

  <!-- divider line -->
  <line x1="40" y1="234" x2="760" y2="234" stroke="#f1f5f9" stroke-width="1"/>
  <text x="40" y="250" font-size="11" fill="#9ca3af">※ anydoc 막대는 최소 크기로 표시 (실제 비율 대비 크게 나타남) · 출처: firecrawl.dev/blog/anydoc-and-pdf-inspector</text>
</svg>
