<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="300" fill="#ffffff"/>
  <!-- 제목 -->
  <text x="400" y="44" text-anchor="middle" font-size="20" font-weight="800" fill="#1f2937">중소기업 반복업무 → AI 대체 시나리오</text>
  <text x="400" y="68" text-anchor="middle" font-size="13" fill="#6b7280">직원이 하루 2시간 이상 반복하는 업무를 AI로 자동화한 예시</text>

  <!-- Before/After 비교 -->
  <!-- Before 박스 -->
  <rect x="30" y="88" width="330" height="190" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="30" y="88" width="330" height="38" rx="12" fill="#ef4444"/>
  <rect x="30" y="108" width="330" height="18" rx="0" fill="#ef4444"/>
  <text x="195" y="113" text-anchor="middle" font-size="15" font-weight="800" fill="white">⏰ 지금 (사람이 직접)</text>

  <text x="55" y="150" font-size="13" fill="#1f2937">▪ 영문 이메일 번역: 30분/건</text>
  <text x="55" y="172" font-size="13" fill="#1f2937">▪ 회의록 요약: 1시간/회의</text>
  <text x="55" y="194" font-size="13" fill="#1f2937">▪ SNS 홍보 이미지: 2~3시간</text>
  <text x="55" y="216" font-size="13" fill="#1f2937">▪ 고객 문의 분류: 매일 1시간</text>
  <text x="55" y="245" font-size="14" font-weight="700" fill="#dc2626">합계: 직원 1인당 하루 4~5시간</text>

  <!-- 화살표 -->
  <text x="400" y="195" text-anchor="middle" font-size="28">→</text>

  <!-- After 박스 -->
  <rect x="440" y="88" width="330" height="190" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="440" y="88" width="330" height="38" rx="12" fill="#16a34a"/>
  <rect x="440" y="108" width="330" height="18" rx="0" fill="#16a34a"/>
  <text x="605" y="113" text-anchor="middle" font-size="15" font-weight="800" fill="white">🤖 허깅페이스 AI 적용 후</text>

  <text x="465" y="150" font-size="13" fill="#1f2937">▪ 번역: Helsinki-NLP → <tspan font-weight="700" fill="#16a34a">즉시</tspan></text>
  <text x="465" y="172" font-size="13" fill="#1f2937">▪ 요약: BART → <tspan font-weight="700" fill="#16a34a">30초</tspan></text>
  <text x="465" y="194" font-size="13" fill="#1f2937">▪ 이미지: Stable Diffusion → <tspan font-weight="700" fill="#16a34a">2분</tspan></text>
  <text x="465" y="216" font-size="13" fill="#1f2937">▪ 분류: BERT → <tspan font-weight="700" fill="#16a34a">자동 처리</tspan></text>
  <text x="465" y="245" font-size="14" font-weight="700" fill="#16a34a">절약: 하루 4시간 이상 확보</text>

  <text x="400" y="292" text-anchor="middle" font-size="11" fill="#9ca3af">모델 출처: huggingface.co / 시간 절감은 업무 복잡도에 따라 달라집니다</text>
</svg>
