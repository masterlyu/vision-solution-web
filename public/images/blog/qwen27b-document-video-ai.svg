<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f766e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)" />
  <circle cx="700" cy="-50" r="200" fill="white" opacity="0.05"/>
  <circle cx="750" cy="420" r="150" fill="white" opacity="0.05"/>
  <!-- 태그 배지 -->
  <rect x="40" y="40" width="80" height="28" rx="14" fill="white" opacity="0.2"/>
  <text x="80" y="59" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="white">AI 활용</text>
  <!-- 우측 아이콘 카드 -->
  <rect x="490" y="60" width="270" height="300" rx="20" fill="url(#card1)" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <!-- 문서 아이콘 (계약서 스타일) -->
  <rect x="555" y="100" width="90" height="115" rx="6" fill="white" opacity="0.2"/>
  <rect x="555" y="100" width="90" height="115" rx="6" fill="none" stroke="white" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="570" y1="128" x2="630" y2="128" stroke="white" stroke-opacity="0.6" stroke-width="2"/>
  <line x1="570" y1="142" x2="630" y2="142" stroke="white" stroke-opacity="0.6" stroke-width="2"/>
  <line x1="570" y1="156" x2="620" y2="156" stroke="white" stroke-opacity="0.6" stroke-width="2"/>
  <line x1="570" y1="170" x2="625" y2="170" stroke="white" stroke-opacity="0.6" stroke-width="2"/>
  <line x1="570" y1="184" x2="615" y2="184" stroke="white" stroke-opacity="0.6" stroke-width="2"/>
  <!-- AI 분석 화살표 -->
  <text x="625" y="168" font-family="Arial, sans-serif" font-size="24" fill="white" opacity="0.9">&#8594;</text>
  <!-- 결과 박스 -->
  <rect x="660" y="130" width="78" height="60" rx="8" fill="white" opacity="0.15" stroke="white" stroke-opacity="0.4" stroke-width="1"/>
  <text x="699" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" opacity="0.9">분석 완료</text>
  <text x="699" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" opacity="0.7">30초</text>
  <text x="625" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.7">Qwen 3.8 27B</text>
  <text x="625" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" opacity="0.5">Apache 2.0 · 무료</text>
  <!-- 좌측 메인 텍스트 -->
  <text x="40" y="130" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="white" opacity="0.8">알리바바 오픈소스 AI</text>
  <text x="40" y="180" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="white">계약서 100장</text>
  <text x="40" y="220" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="white">AI가 통째로 읽는다</text>
  <text x="40" y="267" font-family="Arial, sans-serif" font-size="16" fill="white" opacity="0.85">A4 300페이지 이상 · 영상도 분석 · 5분 설치</text>
  <rect x="40" y="310" width="60" height="4" rx="2" fill="white" opacity="0.6"/>
  <text x="40" y="345" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.6">(주)비젼솔루션</text>
</svg>
