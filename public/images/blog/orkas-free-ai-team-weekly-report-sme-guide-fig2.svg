<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif" role="img" aria-labelledby="t2">
  <title id="t2">월요일 리포트 자동화 3단계: 설치와 로그인, 규칙과 파일 넣기, 주기 실행</title>
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">월요일 리포트 자동화 3단계</text>
  <rect x="40" y="70" width="200" height="90" rx="12" fill="#0f766e"/>
  <text x="140" y="112" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">① 설치·로그인</text>
  <text x="140" y="138" text-anchor="middle" font-size="12" fill="#a7f3d0">앱 받고 첫 실행</text>
  <text x="265" y="122" text-anchor="middle" font-size="28" fill="#94a3b8">→</text>
  <rect x="300" y="70" width="200" height="90" rx="12" fill="#0891b2"/>
  <text x="400" y="112" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">② 규칙·파일 넣기</text>
  <text x="400" y="138" text-anchor="middle" font-size="12" fill="#cffafe">개인정보 열은 지우고</text>
  <text x="525" y="122" text-anchor="middle" font-size="28" fill="#94a3b8">→</text>
  <rect x="560" y="70" width="200" height="90" rx="12" fill="#22d3ee"/>
  <text x="660" y="112" text-anchor="middle" font-size="16" font-weight="800" fill="#083344">③ 주기 실행</text>
  <text x="660" y="138" text-anchor="middle" font-size="12" fill="#083344">검수 후 매주 월요일</text>
</svg>
