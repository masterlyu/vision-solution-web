  <rect x="540" y="64" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="650" y="108" text-anchor="middle" font-size="24" font-weight="900" fill="#0f766e">v0.8 Beta</text>
  <text x="650" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#0891b2">2026.08 공개</text>
  <text x="650" y="155" text-anchor="middle" font-size="12" fill="#6b7280">Microsoft Research</text>
