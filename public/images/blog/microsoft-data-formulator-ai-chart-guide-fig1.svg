  <text x="150" y="148" text-anchor="middle" font-size="13" fill="#6b7280">GitHub 별점</text>
  <!-- 카드 2: 라이선스 -->
  <rect x="290" y="64" width="220" height="110" rx="12" fill="#f0fdfa"/>
