<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">2026년 8월 기준 — ChatGPT 무료 vs Plus</text>
  <!-- 무료 카드 -->
  <rect x="40" y="60" width="220" height="110" rx="12" fill="#f0fdf4"/>
  <text x="150" y="100" text-anchor="middle" font-size="28" font-weight="900" fill="#16a34a">무료</text>
  <text x="150" y="125" text-anchor="middle" font-size="13" fill="#6b7280">GPT-5.6 Luna + Think</text>
  <text x="150" y="148" text-anchor="middle" font-size="13" fill="#6b7280">텍스트 무제한</text>
  <!-- Think 버튼 카드 -->
  <rect x="290" y="60" width="220" height="110" rx="12" fill="#eff6ff"/>
  <text x="400" y="100" text-anchor="middle" font-size="28" font-weight="900" fill="#2563eb">$0/월</text>
  <text x="400" y="125" text-anchor="middle" font-size="13" fill="#6b7280">구독료 없음</text>
  <text x="400" y="148" text-anchor="middle" font-size="13" fill="#6b7280">이미지 생성은 제한</text>
  <!-- Plus 카드 -->
  <rect x="540" y="60" width="220" height="110" rx="12" fill="#fef3c7"/>
  <text x="650" y="100" text-anchor="middle" font-size="28" font-weight="900" fill="#b45309">Plus</text>
  <text x="650" y="125" text-anchor="middle" font-size="13" fill="#6b7280">$20/월 (약 3만원)</text>
  <text x="650" y="148" text-anchor="middle" font-size="13" fill="#6b7280">이미지·파일 무제한</text>
</svg>
