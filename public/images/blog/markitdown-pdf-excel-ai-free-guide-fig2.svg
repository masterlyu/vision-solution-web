<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="260" fill="#ffffff"/>
  <text x="40" y="44" font-size="20" font-weight="800" fill="#1f2937">사내 문서 → AI 분석 3단계 흐름</text>

  <!-- 연결선 -->
  <line x1="60" y1="150" x2="740" y2="150" stroke="#cbd5e1" stroke-width="3"/>

  <!-- 단계 1 -->
  <circle cx="130" cy="150" r="18" fill="#0f766e"/>
  <text x="130" y="156" text-anchor="middle" font-size="14" font-weight="800" fill="white">1</text>
  <text x="130" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">사내 문서</text>
  <text x="130" y="190" text-anchor="middle" font-size="12" fill="#6b7280">PDF·Excel·Word</text>
  <text x="130" y="207" text-anchor="middle" font-size="11" fill="#9ca3af">기존 파일 그대로</text>

  <!-- 화살표 -->
  <text x="270" y="156" text-anchor="middle" font-size="22" fill="#0f766e">→</text>

  <!-- 단계 2 -->
  <circle cx="400" cy="150" r="18" fill="#0f766e"/>
  <text x="400" y="156" text-anchor="middle" font-size="14" font-weight="800" fill="white">2</text>
  <text x="400" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">MarkItDown</text>
  <text x="400" y="122" text-anchor="middle" font-size="12" fill="#0f766e">변환 (무료)</text>
  <text x="400" y="190" text-anchor="middle" font-size="12" fill="#6b7280">마크다운 텍스트로</text>
  <text x="400" y="207" text-anchor="middle" font-size="11" fill="#9ca3af">pip install markitdown</text>

  <!-- 화살표 -->
  <text x="535" y="156" text-anchor="middle" font-size="22" fill="#0f766e">→</text>

  <!-- 단계 3 -->
  <circle cx="670" cy="150" r="18" fill="#06b6d4"/>
  <text x="670" y="156" text-anchor="middle" font-size="14" font-weight="800" fill="white">3</text>
  <text x="670" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">AI 분석·답변</text>
  <text x="670" y="190" text-anchor="middle" font-size="12" fill="#6b7280">ChatGPT·Claude·</text>
  <text x="670" y="207" text-anchor="middle" font-size="11" fill="#9ca3af">사내 챗봇에 붙여넣기</text>

  <!-- 하단 박스 -->
  <rect x="40" y="228" width="720" height="22" rx="4" fill="#f0fdf4"/>
  <text x="400" y="243" text-anchor="middle" font-size="12" fill="#0f766e">💡 GPU 불필요 · 인터넷 불필요 · 데이터 외부 유출 없음 · MIT 라이선스(무료)</text>
</svg>
