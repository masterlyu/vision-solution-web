  <rect x="40" y="60" width="220" height="110" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="150" y="110" text-anchor="middle" font-size="44" font-weight="900" fill="#0f766e">232</text>
  <text x="150" y="150" text-anchor="middle" font-size="14" fill="#6b7280">AI 전문가 에이전트</text>

  <rect x="290" y="60" width="220" height="110" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
