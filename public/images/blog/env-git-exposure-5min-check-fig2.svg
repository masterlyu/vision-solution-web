<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="330" fill="#ffffff"/>
  <text x="40" y="44" font-size="20" font-weight="800" fill="#1f2937">주소창에 쳤을 때, 화면 내용으로 읽으세요</text>
  <rect x="40" y="70" width="220" height="200" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="150" y="104" text-anchor="middle" font-size="18" font-weight="800" fill="#16a34a">괜찮은 결과</text>
  <text x="150" y="138" text-anchor="middle" font-size="19" font-weight="800" fill="#1f2937">404 또는 403</text>
  <text x="150" y="166" text-anchor="middle" font-size="19" font-weight="800" fill="#1f2937">+ 파일 내용 없음</text>
  <text x="150" y="202" text-anchor="middle" font-size="13" fill="#6b7280">조건은 둘 다예요</text>
  <text x="150" y="222" text-anchor="middle" font-size="13" fill="#6b7280">403만으로는 판정하지 않아요</text>
  <text x="150" y="242" text-anchor="middle" font-size="13" fill="#6b7280">그 주소에 한한 결과예요</text>
  <rect x="290" y="70" width="220" height="200" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="400" y="104" text-anchor="middle" font-size="18" font-weight="800" fill="#2563eb">파일 아님</text>
  <text x="400" y="138" text-anchor="middle" font-size="19" font-weight="800" fill="#1f2937">200 + 메인 화면</text>
  <text x="400" y="202" text-anchor="middle" font-size="13" fill="#6b7280">홈페이지 화면이 그대로 뜸</text>
  <text x="400" y="222" text-anchor="middle" font-size="13" fill="#6b7280">200이어도 파일 내용이</text>
  <text x="400" y="242" text-anchor="middle" font-size="13" fill="#6b7280">아니면 노출이 아니에요</text>
  <rect x="540" y="70" width="220" height="200" rx="10" fill="#fef2f2" stroke="#dc2626"/>
  <text x="650" y="104" text-anchor="middle" font-size="18" font-weight="800" fill="#dc2626">위험</text>
  <text x="650" y="138" text-anchor="middle" font-size="19" font-weight="800" fill="#1f2937">ref: refs/heads/</text>
  <text x="650" y="166" text-anchor="middle" font-size="19" font-weight="800" fill="#1f2937">또는 [core]</text>
  <text x="650" y="202" text-anchor="middle" font-size="13" fill="#6b7280">상태 코드가 403이어도</text>
  <text x="650" y="222" text-anchor="middle" font-size="13" fill="#6b7280">이 글자가 보이면 열린 거예요</text>
  <text x="650" y="242" text-anchor="middle" font-size="13" fill="#6b7280">바로 조치하세요</text>
  <text x="40" y="304" font-size="12" fill="#6b7280">판별 기준 출처: BoringSec 「Exposed .env and .git Files」 (2026년 7월 10일)</text>
</svg>
