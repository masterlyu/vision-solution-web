<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">클로바 X 핵심 3가지</text>
  <!-- 카드 1: 무료 -->
  <rect x="40" y="60" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="150" y="118" text-anchor="middle" font-size="38" font-weight="900" fill="#0f766e">₩0</text>
  <text x="150" y="150" text-anchor="middle" font-size="13" fill="#6b7280">클로바 X 이용료</text>
  <!-- 카드 2: 12월 출시 -->
  <rect x="290" y="60" width="220" height="110" rx="12" fill="#ecfeff"/>
  <text x="400" y="118" text-anchor="middle" font-size="38" font-weight="900" fill="#0891b2">12월</text>
  <text x="400" y="150" text-anchor="middle" font-size="13" fill="#6b7280">모두의 AI 출시 예정</text>
  <!-- 카드 3: 무제한 -->
  <rect x="540" y="60" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="650" y="112" text-anchor="middle" font-size="28" font-weight="900" fill="#0f766e">무제한</text>
  <text x="650" y="142" text-anchor="middle" font-size="13" fill="#6b7280">모두의 AI 이용</text>
  <text x="650" y="160" text-anchor="middle" font-size="11" fill="#9ca3af">(정부 발표 목표)</text>
</svg>
