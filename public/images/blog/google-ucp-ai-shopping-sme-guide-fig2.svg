<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="220" fill="#ffffff"/>
  <text x="40" y="38" font-size="18" font-weight="800" fill="#1f2937">Merchant Center로 UCP 등록하기 — 5단계</text>

  <!-- 단계 1 -->
  <rect x="20" y="60" width="130" height="100" rx="10" fill="#0f766e"/>
  <text x="85" y="105" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">① 계정 생성</text>
  <text x="85" y="125" text-anchor="middle" font-size="11" fill="#a7f3d0">Merchant Center</text>
  <text x="85" y="141" text-anchor="middle" font-size="11" fill="#a7f3d0">무료 가입</text>

  <text x="163" y="118" text-anchor="middle" font-size="22" fill="#94a3b8">→</text>

  <!-- 단계 2 -->
  <rect x="175" y="60" width="130" height="100" rx="10" fill="#0891b2"/>
  <text x="240" y="105" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">② 사업자 등록</text>
  <text x="240" y="125" text-anchor="middle" font-size="11" fill="#cffafe">상호명·주소</text>
  <text x="240" y="141" text-anchor="middle" font-size="11" fill="#cffafe">웹사이트 입력</text>

  <text x="318" y="118" text-anchor="middle" font-size="22" fill="#94a3b8">→</text>

  <!-- 단계 3 -->
  <rect x="330" y="60" width="130" height="100" rx="10" fill="#0891b2"/>
  <text x="395" y="105" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">③ 상품 피드</text>
  <text x="395" y="125" text-anchor="middle" font-size="11" fill="#cffafe">CSV 파일로</text>
  <text x="395" y="141" text-anchor="middle" font-size="11" fill="#cffafe">상품 정보 업로드</text>

  <text x="473" y="118" text-anchor="middle" font-size="22" fill="#94a3b8">→</text>

  <!-- 단계 4 -->
  <rect x="485" y="60" width="130" height="100" rx="10" fill="#0891b2"/>
  <text x="550" y="105" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">④ UCP 신청</text>
  <text x="550" y="125" text-anchor="middle" font-size="11" fill="#cffafe">계정 내 UCP</text>
  <text x="550" y="141" text-anchor="middle" font-size="11" fill="#cffafe">메뉴 신청서 제출</text>

  <text x="628" y="118" text-anchor="middle" font-size="22" fill="#94a3b8">→</text>

  <!-- 단계 5 -->
  <rect x="640" y="60" width="130" height="100" rx="10" fill="#22d3ee"/>
  <text x="705" y="105" text-anchor="middle" font-size="13" font-weight="800" fill="#083344">⑤ 테스트</text>
  <text x="705" y="125" text-anchor="middle" font-size="11" fill="#083344">Gemini 앱에서</text>
  <text x="705" y="141" text-anchor="middle" font-size="11" fill="#083344">노출 확인</text>

  <text x="40" y="210" font-size="11" fill="#9ca3af">출처: Google Merchant Center 고객센터 (support.google.com/merchants), Google for Developers</text>
</svg>
