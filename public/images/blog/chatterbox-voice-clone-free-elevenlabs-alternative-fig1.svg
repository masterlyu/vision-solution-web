<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="300" fill="#ffffff"/>
  <text x="40" y="44" font-size="20" font-weight="800" fill="#1f2937">블라인드 선호도 — Chatterbox vs ElevenLabs</text>
  <!-- Bottom baseline -->
  <line x1="40" y1="252" x2="760" y2="252" stroke="#e5e7eb" stroke-width="1.5"/>
  <!-- Chatterbox bar: 65.3% → height 150 → y=102 -->
  <rect x="200" y="102" width="150" height="150" rx="8" fill="#0f766e"/>
  <text x="275" y="86" text-anchor="middle" font-size="28" font-weight="900" fill="#0f766e">65.3%</text>
  <text x="275" y="278" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Chatterbox</text>
