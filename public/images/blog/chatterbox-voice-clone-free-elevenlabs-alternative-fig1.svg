  <text x="525" y="278" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">ElevenLabs</text>
  <text x="525" y="296" text-anchor="middle" font-size="12" fill="#6b7280">(월 $22~)</text>
  <!-- Source note -->
  <text x="760" y="252" text-anchor="end" font-size="11" fill="#9ca3af">출처: resemble-ai/chatterbox (GitHub)</text>
