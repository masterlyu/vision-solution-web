<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">섀도 AI — 지금 우리 회사의 현실</text>
  <!-- 카드 1: 64% -->
  <rect x="40" y="64" width="220" height="110" rx="12" fill="#f5f3ff"/>
  <text x="150" y="120" text-anchor="middle" font-size="38" font-weight="900" fill="#7c3aed">64%</text>
  <text x="150" y="150" text-anchor="middle" font-size="13" fill="#6b7280">직원이 몰래 AI 사용 중</text>
  <!-- 카드 2: 98% -->
  <rect x="290" y="64" width="220" height="110" rx="12" fill="#fdf4ff"/>
  <text x="400" y="120" text-anchor="middle" font-size="38" font-weight="900" fill="#a855f7">98%</text>
  <text x="400" y="150" text-anchor="middle" font-size="13" fill="#6b7280">조직에 무단 AI 사용자 존재</text>
  <!-- 카드 3: 18% -->
  <rect x="540" y="64" width="220" height="110" rx="12" fill="#eff6ff"/>
  <text x="650" y="120" text-anchor="middle" font-size="38" font-weight="900" fill="#2563eb">18%</text>
  <text x="650" y="150" text-anchor="middle" font-size="13" fill="#6b7280">AI 보안 정책 있는 기업</text>
</svg>
