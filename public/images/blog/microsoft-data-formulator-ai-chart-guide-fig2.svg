<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">Data Formulator 사용 3단계</text>
  <!-- 단계 1 -->
  <rect x="40" y="70" width="200" height="90" rx="12" fill="#0f766e"/>
  <text x="140" y="105" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">① 파일 업로드</text>
  <text x="140" y="128" text-anchor="middle" font-size="12" fill="#a7f3d0">엑셀 / CSV 파일을</text>
  <text x="140" y="146" text-anchor="middle" font-size="12" fill="#a7f3d0">그대로 올리기</text>
  <!-- 화살표 1 -->
  <text x="257" y="122" text-anchor="middle" font-size="28" fill="#94a3b8">→</text>
  <!-- 단계 2 -->
  <rect x="300" y="70" width="200" height="90" rx="12" fill="#0891b2"/>
  <text x="400" y="105" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">② AI에 말로 명령</text>
  <text x="400" y="128" text-anchor="middle" font-size="12" fill="#cffafe">"월별 매출을</text>
  <text x="400" y="146" text-anchor="middle" font-size="12" fill="#cffafe">막대 차트로 그려줘"</text>
  <!-- 화살표 2 -->
  <text x="517" y="122" text-anchor="middle" font-size="28" fill="#94a3b8">→</text>
  <!-- 단계 3 -->
  <rect x="560" y="70" width="200" height="90" rx="12" fill="#22d3ee"/>
  <text x="660" y="105" text-anchor="middle" font-size="16" font-weight="800" fill="#083344">③ 차트 자동 생성</text>
  <text x="660" y="128" text-anchor="middle" font-size="12" fill="#083344">수정도 말로</text>
  <text x="660" y="146" text-anchor="middle" font-size="12" fill="#083344">"꺾은선으로 바꿔줘"</text>
</svg>
