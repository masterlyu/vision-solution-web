<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f766e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)" />
  <circle cx="700" cy="-50" r="200" fill="white" opacity="0.05"/>
  <circle cx="750" cy="420" r="150" fill="white" opacity="0.05"/>
  <!-- 태그 배지 -->
  <rect x="40" y="40" width="90" height="28" rx="14" fill="white" opacity="0.2"/>
  <text x="85" y="59" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="white">AI 활용</text>
  <!-- 우측 아이콘 카드 -->
  <rect x="490" y="60" width="270" height="300" rx="20" fill="url(#card1)" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <text x="625" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="75" fill="white" opacity="0.9">📄</text>
  <text x="625" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.8">Gemini CLI</text>
  <text x="625" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.6">Google AI Studio 무료</text>
  <text x="625" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" opacity="0.5">Apache 2.0 · ⭐ 30K+</text>
  <!-- 좌측 메인 텍스트 -->
  <text x="40" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white" opacity="0.8">업무 자동화</text>
  <text x="40" y="178" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="white">직원 대신 구글 AI가</text>
  <text x="40" y="220" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="white">문서를 고친다</text>
  <text x="40" y="265" font-family="Arial, sans-serif" font-size="16" fill="white" opacity="0.85">2시간짜리 주간 보고서 → 5분 자동 완성</text>
  <text x="40" y="295" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.7">Gemini 자동화 3단계 실습 가이드</text>
  <rect x="40" y="330" width="60" height="4" rx="2" fill="white" opacity="0.6"/>
  <text x="40" y="365" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.6">(주)비젼솔루션</text>
