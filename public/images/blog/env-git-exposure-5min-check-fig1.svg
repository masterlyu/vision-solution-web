<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="300" fill="#ffffff"/>
  <text x="40" y="40" font-size="20" font-weight="800" fill="#1f2937">열린 .git 저장소에서 나온 것들 (Intruder 조사)</text>
  <rect x="40" y="70" width="150" height="100" rx="10" fill="#f3e8ff" stroke="#c084fc"/>
  <text x="115" y="112" text-anchor="middle" font-size="26" font-weight="800" fill="#7c3aed">350만</text>
  <text x="115" y="138" text-anchor="middle" font-size="13" fill="#1f2937">점검한 호스트</text>
  <text x="115" y="156" text-anchor="middle" font-size="12" fill="#6b7280">(HTTP 서비스 가동)</text>
  <text x="212" y="124" text-anchor="middle" font-size="24" font-weight="800" fill="#7c3aed">&#8594;</text>
  <rect x="235" y="70" width="150" height="100" rx="10" fill="#7c3aed"/>
  <text x="310" y="112" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">2만 8천</text>
  <text x="310" y="138" text-anchor="middle" font-size="13" fill="#ffffff">노출된 .git 저장소</text>
  <text x="310" y="156" text-anchor="middle" font-size="12" fill="#e9d5ff">(28,000)</text>
  <text x="440" y="76" font-size="14" font-weight="700" fill="#1f2937">저장소 기록에서 복원한 키 (개수)</text>
  <text x="440" y="104" font-size="13" fill="#1f2937">AWS 접속 키</text>
  <rect x="560" y="91" width="200" height="16" rx="3" fill="#7c3aed"/>
  <text x="766" y="104" font-size="13" font-weight="700" fill="#1f2937">400+</text>
  <text x="440" y="132" font-size="13" fill="#1f2937">OpenAI 키</text>
  <rect x="560" y="119" width="61.5" height="16" rx="3" fill="#a855f7"/>
  <text x="627" y="132" font-size="13" font-weight="700" fill="#1f2937">123</text>
  <text x="440" y="160" font-size="13" fill="#1f2937">스트라이프 비밀 키</text>
  <rect x="560" y="147" width="53.5" height="16" rx="3" fill="#a855f7"/>
  <text x="619" y="160" font-size="13" font-weight="700" fill="#1f2937">107</text>
  <text x="440" y="188" font-size="13" fill="#1f2937">텔레그램 토큰</text>
  <rect x="560" y="175" width="40" height="16" rx="3" fill="#a855f7"/>
  <text x="606" y="188" font-size="13" font-weight="700" fill="#1f2937">80</text>
  <text x="440" y="216" font-size="13" fill="#1f2937">깃허브 접근 토큰</text>
  <rect x="560" y="203" width="8.5" height="16" rx="3" fill="#a855f7"/>
  <text x="574" y="216" font-size="13" font-weight="700" fill="#1f2937">17</text>
  <text x="40" y="214" font-size="12" fill="#6b7280">Intruder는 추출한 키 중 상당수가</text>
  <text x="40" y="232" font-size="12" fill="#6b7280">점검 시점에도 유효했다고 밝혔어요.</text>
  <text x="40" y="278" font-size="12" fill="#6b7280">출처: Intruder, 2026년 8월 20일 · 왼쪽은 곳 수, 오른쪽은 키 개수</text>
</svg>
