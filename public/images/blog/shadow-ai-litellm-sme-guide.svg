    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)" />
  <circle cx="720" cy="-40" r="220" fill="white" opacity="0.04"/>
  <circle cx="760" cy="440" r="160" fill="white" opacity="0.04"/>
  <circle cx="400" cy="210" r="300" fill="#4338ca" opacity="0.07"/>
