    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)" />
  <circle cx="700" cy="-50" r="200" fill="white" opacity="0.05"/>
  <circle cx="750" cy="420" r="150" fill="white" opacity="0.05"/>
  <!-- 태그 배지 -->
  <rect x="40" y="40" width="100" height="28" rx="14" fill="white" opacity="0.2"/>
  <text x="90" y="59" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="white">AI 활용</text>
  <!-- 우측 아이콘 카드 -->
  <rect x="480" y="60" width="280" height="300" rx="20" fill="url(#card1)" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <text x="620" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="80" fill="white" opacity="0.9">🎨</text>
  <text x="620" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.8">Aug 30, 2026 종료</text>
  <text x="620" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" opacity="0.55">gpt-image-1로 대체</text>
  <text x="620" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" opacity="0.5">무료 대안 3가지 포함</text>
  <!-- 우측 배지 -->
  <rect x="540" y="68" width="80" height="24" rx="12" fill="#ef4444" opacity="0.9"/>
  <text x="580" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="white">D-1 긴급</text>
