<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f766e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)" />
  <circle cx="700" cy="-50" r="200" fill="white" opacity="0.05"/>
  <circle cx="750" cy="420" r="150" fill="white" opacity="0.05"/>
  <!-- 태그 배지 -->
  <rect x="40" y="40" width="80" height="28" rx="14" fill="white" opacity="0.2"/>
  <text x="80" y="59" text-anchor="middle" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="12" font-weight="700" fill="white">AI 활용</text>
  <!-- 우측 아이콘 카드 -->
  <rect x="480" y="60" width="280" height="300" rx="20" fill="url(#card1)" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <!-- 다이어그램 아이콘 표현 -->
  <rect x="520" y="110" width="60" height="36" rx="6" fill="white" opacity="0.25"/>
  <text x="550" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" opacity="0.9">설명 입력</text>
  <text x="590" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="white" opacity="0.6">→</text>
  <rect x="620" y="110" width="60" height="36" rx="6" fill="white" opacity="0.25"/>
  <text x="650" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" opacity="0.9">AI 분석</text>
  <text x="550" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="white" opacity="0.6">↓</text>
  <rect x="510" y="175" width="190" height="48" rx="8" fill="white" opacity="0.3"/>
  <text x="605" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="white">구조도 자동 생성</text>
  <text x="605" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" opacity="0.8">HTML · PNG · SVG</text>
  <!-- GitHub 스타 배지 -->
  <rect x="510" y="240" width="190" height="32" rx="10" fill="white" opacity="0.15"/>
  <text x="555" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="white" opacity="0.9">⭐</text>
  <text x="620" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="white" opacity="0.9">57,000+ Stars</text>
  <text x="620" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" opacity="0.6">github.com/tt-a1i/archify</text>
  <!-- 좌측 메인 텍스트 -->
  <text x="40" y="130" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15" font-weight="600" fill="white" opacity="0.8">무료 오픈소스</text>
  <text x="40" y="180" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="32" font-weight="900" fill="white">AI가 30초에</text>
  <text x="40" y="222" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="32" font-weight="900" fill="white">구조도 완성</text>
  <text x="40" y="272" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15" fill="white" opacity="0.75">텍스트 입력 → 자동 다이어그램 생성</text>
  <rect x="40" y="310" width="60" height="4" rx="2" fill="white" opacity="0.6"/>
  <text x="40" y="345" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14" fill="white" opacity="0.6">(주)비젼솔루션</text>
</svg>
