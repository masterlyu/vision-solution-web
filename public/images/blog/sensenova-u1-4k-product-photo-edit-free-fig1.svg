<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">SenseNova U1.5 핵심 사양 — 3가지 숫자로 정리</text>
  <!-- 카드 1: 8B 파라미터 -->
  <rect x="40" y="64" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="150" y="118" text-anchor="middle" font-size="40" font-weight="900" fill="#0f766e">8B</text>
  <text x="150" y="148" text-anchor="middle" font-size="13" fill="#6b7280">파라미터 (모델 크기)</text>
  <!-- 카드 2: 4K -->
  <rect x="290" y="64" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="400" y="118" text-anchor="middle" font-size="40" font-weight="900" fill="#0f766e">4K</text>
  <text x="400" y="148" text-anchor="middle" font-size="13" fill="#6b7280">최대 출력 해상도</text>
  <!-- 카드 3: MIT 무료 -->
  <rect x="540" y="64" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="650" y="118" text-anchor="middle" font-size="40" font-weight="900" fill="#0f766e">MIT</text>
  <text x="650" y="148" text-anchor="middle" font-size="13" fill="#6b7280">라이선스 — 상업 무료</text>
</svg>
