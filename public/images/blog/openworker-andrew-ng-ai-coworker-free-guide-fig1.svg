<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="320" fill="#ffffff"/>
  <!-- 제목 -->
  <text x="40" y="44" font-size="19" font-weight="800" fill="#1f2937">이메일 정리 업무: 기존 AI 채팅 vs OpenWorker</text>
  <!-- 구분선 -->
  <line x1="40" y1="58" x2="760" y2="58" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 왼쪽: 기존 AI 채팅 -->
  <rect x="40" y="72" width="340" height="36" rx="8" fill="#f1f5f9"/>
  <text x="60" y="95" font-size="15" font-weight="700" fill="#6b7280">기존 AI 채팅</text>
  <rect x="330" y="78" width="44" height="24" rx="6" fill="#e2e8f0"/>
  <text x="352" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#94a3b8">30분</text>

  <!-- 기존 방식 단계 (5단계) -->
  <rect x="40" y="118" width="340" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="70" y="140" font-size="14" fill="#374151">① AI에게 슬랙 / 이메일 요약 요청</text>
  <circle cx="54" cy="135" r="8" fill="#cbd5e1"/>
  <text x="54" y="139" text-anchor="middle" font-size="10" font-weight="700" fill="#64748b">1</text>

  <rect x="40" y="160" width="340" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="70" y="182" font-size="14" fill="#374151">② 텍스트 설명만 돌아옴</text>
  <circle cx="54" cy="177" r="8" fill="#cbd5e1"/>
  <text x="54" y="181" text-anchor="middle" font-size="10" font-weight="700" fill="#64748b">2</text>

  <rect x="40" y="202" width="340" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="70" y="224" font-size="14" fill="#374151">③ Gmail 직접 열고 수동 분류</text>
  <circle cx="54" cy="219" r="8" fill="#cbd5e1"/>
  <text x="54" y="223" text-anchor="middle" font-size="10" font-weight="700" fill="#64748b">3</text>

  <rect x="40" y="244" width="340" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="70" y="266" font-size="14" fill="#374151">④ 담당자 찾아서 DM 직접 발송</text>
  <circle cx="54" cy="261" r="8" fill="#cbd5e1"/>
  <text x="54" y="265" text-anchor="middle" font-size="10" font-weight="700" fill="#64748b">4</text>

  <!-- 소요 시간 라벨 -->
  <text x="210" y="302" text-anchor="middle" font-size="13" fill="#94a3b8">설명 받고 직접 처리: 약 30분</text>

  <!-- 화살표 -->
  <text x="394" y="200" text-anchor="middle" font-size="28" fill="#0f766e">→</text>

  <!-- 오른쪽: OpenWorker -->
  <rect x="420" y="72" width="340" height="36" rx="8" fill="#ccfbf1"/>
  <text x="440" y="95" font-size="15" font-weight="700" fill="#0f766e">OpenWorker</text>
  <rect x="704" y="78" width="50" height="24" rx="6" fill="#99f6e4"/>
  <text x="729" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#0d9488">5분</text>

  <!-- OpenWorker 단계 (3단계) -->
  <rect x="420" y="118" width="340" height="34" rx="6" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
  <text x="450" y="140" font-size="14" fill="#374151">① 업무 지시 입력</text>
  <circle cx="434" cy="135" r="8" fill="#2dd4bf"/>
  <text x="434" y="139" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">1</text>

  <rect x="420" y="160" width="340" height="34" rx="6" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
  <text x="450" y="182" font-size="14" fill="#374151">② AI 실행 계획 확인 → 승인</text>
  <circle cx="434" cy="177" r="8" fill="#2dd4bf"/>
  <text x="434" y="181" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">2</text>

  <rect x="420" y="202" width="340" height="34" rx="6" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
  <text x="450" y="224" font-size="14" fill="#374151">③ Gmail 자동 분류 · DM 자동 발송</text>
  <circle cx="434" cy="219" r="8" fill="#0d9488"/>
  <text x="434" y="223" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">3</text>

  <!-- 완료 배지 -->
  <rect x="420" y="244" width="340" height="34" rx="6" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="590" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">완성된 결과물 전달 ✓</text>

  <!-- 소요 시간 라벨 -->
  <text x="590" y="302" text-anchor="middle" font-size="13" fill="#0d9488" font-weight="600">AI가 직접 처리: 약 5분</text>
</svg>
