<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f766e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)" />
  <circle cx="700" cy="-50" r="200" fill="white" opacity="0.05"/>
  <circle cx="750" cy="420" r="150" fill="white" opacity="0.05"/>
  <!-- 태그 배지 -->
  <rect x="40" y="40" width="90" height="28" rx="14" fill="white" opacity="0.2"/>
  <text x="85" y="59" text-anchor="middle" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="12" font-weight="700" fill="white">AI 활용</text>
  <!-- 우측 아이콘 카드 -->
  <rect x="490" y="60" width="270" height="300" rx="20" fill="url(#card1)" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <text x="625" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="76" fill="white" opacity="0.9">🎨</text>
  <text x="625" y="235" text-anchor="middle" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14" fill="white" opacity="0.75">인스타 · 왓츠앱 · Meta AI</text>
  <text x="625" y="258" text-anchor="middle" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="12" fill="white" opacity="0.55">무료 · 설치 없음 · 5분 완성</text>
  <!-- 좌측 메인 텍스트 -->
  <text x="40" y="128" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14" font-weight="600" fill="white" opacity="0.8">소상공인 AI 마케팅 가이드</text>
  <text x="40" y="175" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="32" font-weight="900" fill="white">인스타 AI 이미지</text>
  <text x="40" y="215" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="32" font-weight="900" fill="white">광고 사진 5분 만들기</text>
  <text x="40" y="265" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14" fill="white" opacity="0.8">메타 뮤즈 이미지 (Muse Image) 소상공인 활용 가이드</text>
  <rect x="40" y="310" width="60" height="4" rx="2" fill="white" opacity="0.6"/>
  <text x="40" y="345" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="13" fill="white" opacity="0.6">(주)비젼솔루션</text>
