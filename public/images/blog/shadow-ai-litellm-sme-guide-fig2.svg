<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">LiteLLM 도입 3단계 — pip 한 줄로 시작</text>
  <!-- Step 1 -->
  <rect x="40" y="65" width="200" height="100" rx="12" fill="#312e81"/>
  <text x="140" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">① 설치</text>
  <text x="140" y="132" text-anchor="middle" font-size="12" fill="#c7d2fe">pip install litellm</text>
  <text x="140" y="152" text-anchor="middle" font-size="11" fill="#a5b4fc">또는 Docker 1줄</text>
  <!-- Arrow 1 -->
  <text x="263" y="125" text-anchor="middle" font-size="26" fill="#94a3b8">→</text>
  <!-- Step 2 -->
  <rect x="300" y="65" width="200" height="100" rx="12" fill="#4338ca"/>
  <text x="400" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">② 설정</text>
  <text x="400" y="132" text-anchor="middle" font-size="12" fill="#c7d2fe">API 키 + 모델 제한</text>
  <text x="400" y="152" text-anchor="middle" font-size="11" fill="#a5b4fc">예산 한도 지정</text>
  <!-- Arrow 2 -->
  <text x="523" y="125" text-anchor="middle" font-size="26" fill="#94a3b8">→</text>
  <!-- Step 3 -->
  <rect x="560" y="65" width="200" height="100" rx="12" fill="#6366f1"/>
  <text x="660" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">③ 팀 공유</text>
  <text x="660" y="132" text-anchor="middle" font-size="12" fill="#e0e7ff">서버 URL 공유</text>
  <text x="660" y="152" text-anchor="middle" font-size="11" fill="#c7d2fe">모든 AI가 관문 통과</text>
</svg>
