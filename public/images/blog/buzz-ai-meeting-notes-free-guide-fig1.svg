<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">Buzz 핵심 수치 3가지</text>
  <!-- 카드 1: 월 구독료 -->
  <rect x="40" y="60" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="150" y="118" text-anchor="middle" font-size="40" font-weight="900" fill="#0f766e">$0</text>
  <text x="150" y="148" text-anchor="middle" font-size="13" fill="#6b7280">월 구독료 (MIT 무료)</text>
  <!-- 카드 2: 데이터 저장 -->
  <rect x="290" y="60" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="400" y="118" text-anchor="middle" font-size="30" font-weight="900" fill="#0f766e">로컬</text>
  <text x="400" y="148" text-anchor="middle" font-size="13" fill="#6b7280">데이터 저장 — 내 PC만</text>
  <!-- 카드 3: 언어 지원 -->
  <rect x="540" y="60" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="650" y="112" text-anchor="middle" font-size="28" font-weight="900" fill="#0f766e">99개</text>
  <text x="650" y="140" text-anchor="middle" font-size="13" fill="#6b7280">Whisper 지원 언어</text>
  <text x="650" y="158" text-anchor="middle" font-size="13" fill="#6b7280">(한국어 포함)</text>
</svg>
