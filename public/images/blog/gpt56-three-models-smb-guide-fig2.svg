  <!-- Luna 박스 -->
  <rect x="40" y="64" width="200" height="100" rx="12" fill="#0f766e"/>
  <text x="140" y="100" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">① Luna</text>
  <text x="140" y="122" text-anchor="middle" font-size="12" fill="#a7f3d0">반복 업무 대량 처리</text>
  <text x="140" y="143" text-anchor="middle" font-size="11" fill="#a7f3d0">번역·FAQ·SNS 초안</text>
  <!-- 화살표 -->
  <text x="265" y="122" text-anchor="middle" font-size="28" fill="#94a3b8">→</text>
  <!-- Terra 박스 -->
  <rect x="300" y="64" width="200" height="100" rx="12" fill="#0891b2"/>
  <text x="400" y="100" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">② Terra</text>
  <text x="400" y="122" text-anchor="middle" font-size="12" fill="#cffafe">일반 문서·제안서</text>
  <text x="400" y="143" text-anchor="middle" font-size="11" fill="#cffafe">마케팅 카피·회의록</text>
  <!-- 화살표 -->
  <text x="525" y="122" text-anchor="middle" font-size="28" fill="#94a3b8">→</text>
  <!-- Sol 박스 -->
  <rect x="560" y="64" width="200" height="100" rx="12" fill="#22d3ee"/>
  <text x="660" y="100" text-anchor="middle" font-size="15" font-weight="800" fill="#083344">③ Sol</text>
  <text x="660" y="122" text-anchor="middle" font-size="12" fill="#083344">복잡 분석·전략 보고</text>
  <text x="660" y="143" text-anchor="middle" font-size="11" fill="#083344">경쟁사 리서치·법률검토</text>
