<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">Lovart AI 시작 3단계</text>
  <!-- 단계 1 -->
  <rect x="40" y="65" width="200" height="100" rx="12" fill="#0f766e"/>
  <text x="140" y="107" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">① 가입 · 크레딧</text>
  <text x="140" y="130" text-anchor="middle" font-size="12" fill="#a7f3d0">lovart.ai 무료 계정</text>
  <text x="140" y="148" text-anchor="middle" font-size="12" fill="#a7f3d0">즉시 크레딧 제공</text>
  <!-- 화살표 -->
  <text x="265" y="122" text-anchor="middle" font-size="28" fill="#94a3b8">→</text>
  <!-- 단계 2 -->
  <rect x="300" y="65" width="200" height="100" rx="12" fill="#0891b2"/>
  <text x="400" y="107" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">② 프롬프트 입력</text>
  <text x="400" y="130" text-anchor="middle" font-size="12" fill="#cffafe">원하는 디자인을</text>
  <text x="400" y="148" text-anchor="middle" font-size="12" fill="#cffafe">한 문장으로</text>
  <!-- 화살표 -->
  <text x="525" y="122" text-anchor="middle" font-size="28" fill="#94a3b8">→</text>
  <!-- 단계 3 -->
  <rect x="560" y="65" width="200" height="100" rx="12" fill="#22d3ee"/>
  <text x="660" y="107" text-anchor="middle" font-size="15" font-weight="800" fill="#083344">③ 선택 · 다운로드</text>
  <text x="660" y="130" text-anchor="middle" font-size="12" fill="#083344">시안 선택 후</text>
  <text x="660" y="148" text-anchor="middle" font-size="12" fill="#083344">고해상도 저장</text>
</svg>
