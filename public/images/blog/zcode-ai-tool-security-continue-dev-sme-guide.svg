<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)" />
  <circle cx="700" cy="-50" r="200" fill="white" opacity="0.05"/>
  <circle cx="750" cy="420" r="150" fill="white" opacity="0.05"/>
  <!-- 태그 배지 -->
  <rect x="40" y="40" width="130" height="28" rx="14" fill="white" opacity="0.2"/>
  <text x="105" y="59" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="white">AI 보안 경고</text>
  <!-- 우측 아이콘 카드 -->
  <rect x="480" y="60" width="280" height="300" rx="20" fill="url(#card1)" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <text x="620" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="80" fill="white" opacity="0.9">🔒</text>
  <text x="620" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="white" opacity="0.7">ZCode 사건 분석</text>
  <text x="620" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.5">Continue.dev 대안 가이드</text>
  <!-- 좌측 메인 텍스트 -->
  <text x="40" y="120" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="white" opacity="0.8">AI 도구 보안</text>
  <text x="40" y="163" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="white">AI 도구가 파일</text>
  <text x="40" y="196" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="white">몰래 업로드</text>
  <text x="40" y="229" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="white">— 5분 안전 점검법</text>
  <text x="40" y="263" font-family="Arial, sans-serif" font-size="15" fill="white" opacity="0.75">설치 전 5가지 확인 + 무료 대안</text>
  <rect x="40" y="308" width="60" height="4" rx="2" fill="white" opacity="0.6"/>
  <text x="40" y="343" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.6">(주)비젼솔루션</text>
