<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">섀도AI 현황 — 이미 우리 회사에 있습니다</text>
  <!-- 카드 1: 64% -->
  <rect x="40" y="60" width="220" height="115" rx="12" fill="#ede9fe"/>
  <text x="150" y="120" text-anchor="middle" font-size="42" font-weight="900" fill="#4338ca">64%</text>
  <text x="150" y="152" text-anchor="middle" font-size="13" fill="#6b7280">직원 무단 AI 사용</text>
  <!-- 카드 2: 98% -->
  <rect x="290" y="60" width="220" height="115" rx="12" fill="#fce7f3"/>
  <text x="400" y="120" text-anchor="middle" font-size="42" font-weight="900" fill="#9d174d">98%</text>
  <text x="400" y="152" text-anchor="middle" font-size="13" fill="#6b7280">기업에 무단 AI 사용자 존재</text>
  <!-- 카드 3: 18% -->
  <rect x="540" y="60" width="220" height="115" rx="12" fill="#dcfce7"/>
  <text x="650" y="120" text-anchor="middle" font-size="42" font-weight="900" fill="#166534">18%</text>
  <text x="650" y="152" text-anchor="middle" font-size="13" fill="#6b7280">AI 보안정책 있는 기업</text>
</svg>
