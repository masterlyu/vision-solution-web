<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="220" fill="#ffffff"/>
  <text x="40" y="42" font-size="17" font-weight="800" fill="#1f2937">사양별 Colibri 처리 속도 (GPU 없음)</text>
  <text x="40" y="65" font-size="12" fill="#6b7280">출처: github.com/JustVugg/colibri README, betterstack.com/community/guides/ai/colibri-glm</text>
  <rect x="40" y="82" width="220" height="118" rx="12" fill="#fef3c7"/>
  <text x="150" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">RAM 25GB (최소사양)</text>
  <text x="150" y="148" text-anchor="middle" font-size="28" font-weight="900" fill="#b45309">0.05~0.1</text>
  <text x="150" y="170" text-anchor="middle" font-size="12" fill="#92400e">tok/s</text>
  <text x="150" y="190" text-anchor="middle" font-size="11" fill="#b45309">한 문장 = 수십 초~수 분</text>
  <rect x="290" y="82" width="220" height="118" rx="12" fill="#ecfdf5"/>
  <text x="400" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">RAM 128GB (고사양)</text>
  <text x="400" y="148" text-anchor="middle" font-size="28" font-weight="900" fill="#0f766e">~1.8</text>
  <text x="400" y="170" text-anchor="middle" font-size="12" fill="#065f46">tok/s</text>
  <text x="400" y="190" text-anchor="middle" font-size="11" fill="#0f766e">실무 사용 가능 수준</text>
  <rect x="540" y="82" width="220" height="118" rx="12" fill="#fef3c7"/>
  <text x="650" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">MacBook M2 Max</text>
  <text x="650" y="148" text-anchor="middle" font-size="28" font-weight="900" fill="#b45309">~0.1</text>
  <text x="650" y="170" text-anchor="middle" font-size="12" fill="#92400e">tok/s</text>
  <text x="650" y="190" text-anchor="middle" font-size="11" fill="#b45309">최소사양과 비슷한 수준</text>
</svg>
