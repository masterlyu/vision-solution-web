<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="260" fill="#ffffff"/>
  <text x="40" y="44" font-size="20" font-weight="800" fill="#1f2937">구글 UCP 도입 타임라인 (2026)</text>
  <line x1="80" y1="150" x2="720" y2="150" stroke="#cbd5e1" stroke-width="3"/>

  <!-- 마디 1: 2026년 1월 -->
  <circle cx="120" cy="150" r="12" fill="#0f766e"/>
  <text x="120" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">2026년 1월</text>
  <text x="120" y="183" text-anchor="middle" font-size="12" fill="#6b7280">NRF 발표</text>
  <text x="120" y="200" text-anchor="middle" font-size="11" fill="#6b7280">UCP 공식 공개</text>

  <!-- 마디 2: 2026년 3월 -->
  <circle cx="360" cy="150" r="12" fill="#0891b2"/>
  <text x="360" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">2026년 3월</text>
  <text x="360" y="183" text-anchor="middle" font-size="12" fill="#6b7280">Merchant Center</text>
  <text x="360" y="200" text-anchor="middle" font-size="11" fill="#6b7280">모든 규모 개방</text>

  <!-- 마디 3: 2026년 여름 -->
  <circle cx="580" cy="150" r="12" fill="#22d3ee"/>
  <text x="580" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">2026년 여름</text>
  <text x="580" y="183" text-anchor="middle" font-size="12" fill="#6b7280">Universal Cart</text>
  <text x="580" y="200" text-anchor="middle" font-size="11" fill="#6b7280">Search·Gemini 출시(미국)</text>

  <!-- 마디 4: 2026년 말 -->
  <circle cx="720" cy="150" r="12" fill="#0f766e" opacity="0.5"/>
  <text x="720" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">2026년 말</text>
  <text x="720" y="183" text-anchor="middle" font-size="12" fill="#6b7280">글로벌 확대</text>
  <text x="720" y="200" text-anchor="middle" font-size="11" fill="#6b7280">캐나다·호주·영국 등</text>

  <text x="40" y="245" font-size="11" fill="#9ca3af">출처: Google Blog (blog.google), Google for Developers (developers.google.com/merchant/ucp)</text>
