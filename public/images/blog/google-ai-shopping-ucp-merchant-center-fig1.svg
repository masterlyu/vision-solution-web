<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">구글 AI 쇼핑 현황 — 주요 수치 3가지</text>
  <!-- 카드 1: UCP 파트너 수 -->
  <rect x="40" y="60" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="150" y="118" text-anchor="middle" font-size="40" font-weight="900" fill="#0f766e">20+</text>
  <text x="150" y="148" text-anchor="middle" font-size="13" fill="#6b7280">UCP 참여 기업 수</text>
  <text x="150" y="166" text-anchor="middle" font-size="11" fill="#9ca3af">(Visa, Mastercard, Shopify 등)</text>
  <!-- 카드 2: 비용 -->
  <rect x="290" y="60" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="400" y="118" text-anchor="middle" font-size="40" font-weight="900" fill="#0f766e">0원</text>
  <text x="400" y="148" text-anchor="middle" font-size="13" fill="#6b7280">Merchant Center 등록 비용</text>
  <text x="400" y="166" text-anchor="middle" font-size="11" fill="#9ca3af">(광고비 없이 무료 노출 가능)</text>
  <!-- 카드 3: AI 노출 채널 수 -->
  <rect x="540" y="60" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="650" y="118" text-anchor="middle" font-size="40" font-weight="900" fill="#0f766e">2개</text>
  <text x="650" y="148" text-anchor="middle" font-size="13" fill="#6b7280">AI 노출 채널</text>
  <text x="650" y="166" text-anchor="middle" font-size="11" fill="#9ca3af">(구글 AI 모드·Gemini)</text>
</svg>
