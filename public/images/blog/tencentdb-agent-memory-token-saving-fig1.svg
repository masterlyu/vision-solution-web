<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">TencentDB Agent Memory 도입 효과 (OpenClaw 통합 기준)</text>
  <!-- 카드 1: 토큰 감소 -->
  <rect x="40" y="64" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="150" y="120" text-anchor="middle" font-size="36" font-weight="900" fill="#0f766e">61.38%</text>
  <text x="150" y="150" text-anchor="middle" font-size="13" fill="#6b7280">AI 토큰 사용량 감소</text>
  <!-- 카드 2: 성공률 향상 -->
  <rect x="290" y="64" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="400" y="120" text-anchor="middle" font-size="36" font-weight="900" fill="#0f766e">51.52%</text>
  <text x="400" y="150" text-anchor="middle" font-size="13" fill="#6b7280">에이전트 작업 성공률 향상</text>
  <!-- 카드 3: GitHub 스타 -->
  <rect x="540" y="64" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="650" y="120" text-anchor="middle" font-size="36" font-weight="900" fill="#0f766e">12,900+</text>
  <text x="650" y="150" text-anchor="middle" font-size="13" fill="#6b7280">GitHub 스타 (2026-08-05 기준)</text>
</svg>
