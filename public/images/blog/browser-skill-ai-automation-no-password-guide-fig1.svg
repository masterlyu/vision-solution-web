<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="280" fill="#ffffff"/>
  <text x="40" y="44" font-size="20" font-weight="800" fill="#1f2937">기존 방식 vs BrowserSkill — 보안 구조 비교</text>

  <!-- 기존 방식 카드 (왼쪽) -->
  <rect x="40" y="68" width="340" height="180" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="210" y="102" text-anchor="middle" font-size="15" font-weight="800" fill="#dc2626">기존 AI 자동화 방식</text>
  <line x1="60" y1="112" x2="360" y2="112" stroke="#fca5a5" stroke-width="1"/>
  <text x="60" y="138" font-size="13" fill="#7f1d1d">⚠ 비밀번호를 AI에게 직접 전달</text>
  <text x="60" y="162" font-size="13" fill="#7f1d1d">⚠ 자격 증명 유출 위험 상존</text>
  <text x="60" y="186" font-size="13" fill="#7f1d1d">⚠ AI가 잘못 쓰면 계정 피해 가능</text>
  <text x="60" y="210" font-size="13" fill="#7f1d1d">⚠ 2단계 인증 설정 시 막힘</text>
  <text x="210" y="235" text-anchor="middle" font-size="12" fill="#ef4444" font-weight="700">비밀번호 공유 필요</text>

  <!-- BrowserSkill 카드 (오른쪽) -->
  <rect x="420" y="68" width="340" height="180" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="590" y="102" text-anchor="middle" font-size="15" font-weight="800" fill="#16a34a">BrowserSkill</text>
  <line x1="440" y1="112" x2="740" y2="112" stroke="#86efac" stroke-width="1"/>
  <text x="440" y="138" font-size="13" fill="#14532d">✅ 비밀번호를 AI에게 주지 않음</text>
  <text x="440" y="162" font-size="13" fill="#14532d">✅ 내가 로그인한 브라우저를 AI가 사용</text>
  <text x="440" y="186" font-size="13" fill="#14532d">✅ 캡차/OTP는 사람이 처리 후 재개</text>
  <text x="440" y="210" font-size="13" fill="#14532d">✅ MIT 오픈소스 · 무료 상업 이용</text>
  <text x="590" y="235" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="700">비밀번호 전달 없음</text>

  <!-- 화살표/대비 표시 -->
  <text x="400" y="168" text-anchor="middle" font-size="26" fill="#94a3b8">→</text>
</svg>
