  <text x="620" y="210" text-anchor="middle" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" font-weight="800" fill="#a5f3fc">Terra</text>
  <text x="620" y="238" text-anchor="middle" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="13" fill="white" opacity="0.6">균형형 · GPT-5.5급</text>
  <text x="620" y="278" text-anchor="middle" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="20" font-weight="800" fill="#67e8f9">Luna</text>
