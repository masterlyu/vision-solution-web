<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">Gemini 문서 자동화 3단계</text>
  <!-- 단계 1 -->
  <rect x="40" y="65" width="200" height="95" rx="12" fill="#0f766e"/>
  <text x="140" y="105" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">① 데이터 내보내기</text>
  <text x="140" y="128" text-anchor="middle" font-size="12" fill="#a7f3d0">스프레드시트 → CSV</text>
  <text x="140" y="148" text-anchor="middle" font-size="11" fill="#a7f3d0">기존 방식 그대로</text>
  <!-- 화살표 -->
  <text x="260" y="122" text-anchor="middle" font-size="28" fill="#94a3b8">→</text>
  <!-- 단계 2 -->
  <rect x="295" y="65" width="210" height="95" rx="12" fill="#0891b2"/>
  <text x="400" y="105" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">② Gemini 분석·요약</text>
  <text x="400" y="128" text-anchor="middle" font-size="12" fill="#cffafe">CSV → 보고서 초안</text>
  <text x="400" y="148" text-anchor="middle" font-size="11" fill="#cffafe">한국어 지시, 한국어 출력</text>
  <!-- 화살표 -->
  <text x="525" y="122" text-anchor="middle" font-size="28" fill="#94a3b8">→</text>
  <!-- 단계 3 -->
  <rect x="555" y="65" width="205" height="95" rx="12" fill="#22d3ee"/>
  <text x="657" y="105" text-anchor="middle" font-size="15" font-weight="800" fill="#083344">③ 구글 문서 반영</text>
  <text x="657" y="128" text-anchor="middle" font-size="12" fill="#083344">복붙 또는 Apps Script</text>
  <text x="657" y="148" text-anchor="middle" font-size="11" fill="#164e63">검토 후 배포</text>
</svg>
