<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f766e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)" />
  <circle cx="700" cy="-50" r="200" fill="white" opacity="0.05"/>
  <circle cx="750" cy="420" r="150" fill="white" opacity="0.05"/>
  <!-- 태그 배지 -->
  <rect x="40" y="40" width="110" height="28" rx="14" fill="white" opacity="0.2"/>
  <text x="95" y="59" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="white">AI 오픈소스</text>
  <!-- 우측 아이콘 카드 -->
  <rect x="480" y="60" width="280" height="300" rx="20" fill="url(#card1)" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <!-- MIT 배지 -->
  <rect x="530" y="100" width="80" height="30" rx="8" fill="white" opacity="0.25"/>
  <text x="570" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="white">MIT</text>
  <!-- 점수 표시 -->
  <text x="620" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="white" opacity="0.95">90.6</text>
  <text x="620" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.7">Terminal-Bench 2.1</text>
  <text x="620" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" opacity="0.5">코딩 자동화 벤치마크</text>
  <!-- 가격 표시 -->
  <rect x="510" y="278" width="220" height="52" rx="10" fill="white" opacity="0.12"/>
  <text x="620" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" opacity="0.7">API 비용 경쟁 모델 대비</text>
  <text x="620" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="white">약 1/30 수준</text>
  <!-- 좌측 메인 텍스트 -->
  <text x="40" y="130" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="white" opacity="0.8">DeepSeek V4.1 Flash</text>
  <text x="40" y="180" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="white">무료 AI 세계 1위</text>
  <text x="40" y="220" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="white">V4.1 Flash 5분 실습</text>
  <text x="40" y="270" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.75">552B MoE · MIT 라이선스 · 100만 토큰</text>
  <!-- 구분선 + 회사명 -->
  <rect x="40" y="310" width="60" height="4" rx="2" fill="white" opacity="0.6"/>
  <text x="40" y="345" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.6">(주)비젼솔루션</text>
