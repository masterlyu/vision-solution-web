<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="300" fill="#ffffff"/>
  <text x="40" y="44" font-size="20" font-weight="800" fill="#1f2937">MarkItDown 지원 포맷 — 12종 이상</text>
  <text x="40" y="68" font-size="13" fill="#6b7280">GPU 불필요 · MIT 라이선스 · 로컬 실행 · 인터넷 불필요</text>

  <!-- 포맷 박스들 -->
  <!-- Row 1 -->
  <rect x="40" y="90" width="110" height="52" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="95" y="112" text-anchor="middle" font-size="18">📕</text>
  <text x="95" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">PDF</text>

  <rect x="165" y="90" width="110" height="52" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="220" y="112" text-anchor="middle" font-size="18">📘</text>
  <text x="220" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">Word</text>

  <rect x="290" y="90" width="110" height="52" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="345" y="112" text-anchor="middle" font-size="18">📗</text>
  <text x="345" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">Excel</text>

  <rect x="415" y="90" width="110" height="52" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="470" y="112" text-anchor="middle" font-size="18">📙</text>
  <text x="470" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">PowerPoint</text>

  <rect x="540" y="90" width="110" height="52" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="595" y="112" text-anchor="middle" font-size="18">🌐</text>
  <text x="595" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#0284c7">HTML</text>

  <rect x="665" y="90" width="110" height="52" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="720" y="112" text-anchor="middle" font-size="18">📊</text>
  <text x="720" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#0284c7">CSV / JSON</text>

  <!-- Row 2 -->
  <rect x="40" y="158" width="110" height="52" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="95" y="180" text-anchor="middle" font-size="18">🖼️</text>
  <text x="95" y="201" text-anchor="middle" font-size="13" font-weight="700" fill="#ca8a04">이미지</text>

  <rect x="165" y="158" width="110" height="52" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="220" y="180" text-anchor="middle" font-size="18">🗜️</text>
  <text x="220" y="201" text-anchor="middle" font-size="13" font-weight="700" fill="#ca8a04">ZIP</text>

  <rect x="290" y="158" width="110" height="52" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="345" y="180" text-anchor="middle" font-size="18">📝</text>
  <text x="345" y="201" text-anchor="middle" font-size="13" font-weight="700" fill="#ca8a04">XML</text>

  <!-- 스캔 PDF 경고 -->
  <rect x="415" y="158" width="360" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="595" y="180" text-anchor="middle" font-size="14" fill="#dc2626">⚠️ 스캔 이미지 PDF는 미지원</text>
  <text x="595" y="200" text-anchor="middle" font-size="12" fill="#dc2626">(텍스트 없는 PDF — OCR 별도 필요)</text>

  <!-- 하단 출처 -->
  <text x="40" y="272" font-size="12" fill="#9ca3af">출처: github.com/microsoft/markitdown · GitHub Stars 150,000+</text>
</svg>
