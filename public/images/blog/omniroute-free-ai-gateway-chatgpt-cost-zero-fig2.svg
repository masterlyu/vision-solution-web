<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="300" fill="#ffffff"/>
  <text x="40" y="44" font-size="20" font-weight="800" fill="#1f2937">월 AI 비용 비교 — 직원 10명 기준</text>
  <!-- 왼쪽 막대: ChatGPT Plus x10 -->
  <rect x="130" y="80" width="160" height="170" rx="6" fill="#e5e7eb"/>
  <text x="210" y="65" text-anchor="middle" font-size="24" font-weight="900" fill="#6b7280">270,000원</text>
  <text x="210" y="270" text-anchor="middle" font-size="15" fill="#1f2937">ChatGPT Plus</text>
  <text x="210" y="290" text-anchor="middle" font-size="13" fill="#9ca3af">10명 × 27,000원/월</text>
  <!-- 오른쪽 막대: OmniRoute -->
  <rect x="510" y="220" width="160" height="30" rx="6" fill="#0f766e"/>
  <text x="590" y="205" text-anchor="middle" font-size="24" font-weight="900" fill="#0f766e">0원</text>
  <text x="590" y="270" text-anchor="middle" font-size="15" fill="#1f2937">OmniRoute + 무료 API</text>
  <text x="590" y="290" text-anchor="middle" font-size="13" fill="#9ca3af">MIT 라이선스 · 설치 10분</text>
  <!-- 화살표/레이블 -->
  <text x="400" y="165" text-anchor="middle" font-size="18" font-weight="800" fill="#16a34a">월 27만 원 절감</text>
  <line x1="320" y1="180" x2="490" y2="210" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,3"/>
</svg>
