<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">100만 토큰 처리 비용 비교 (입력 기준)</text>
  <!-- 카드 1: Grok 4.6 입력 -->
  <rect x="40" y="60" width="220" height="110" rx="12" fill="#f0fdf4"/>
  <text x="150" y="108" text-anchor="middle" font-size="40" font-weight="900" fill="#0f766e">$2</text>
  <text x="150" y="148" text-anchor="middle" font-size="13" fill="#6b7280">Grok 4.6 입력</text>
  <!-- 카드 2: GPT-5.6 Sol 입력 -->
  <rect x="290" y="60" width="220" height="110" rx="12" fill="#fef2f2"/>
  <text x="400" y="108" text-anchor="middle" font-size="40" font-weight="900" fill="#dc2626">$5</text>
  <text x="400" y="148" text-anchor="middle" font-size="13" fill="#6b7280">GPT-5.6 Sol 입력</text>
  <!-- 카드 3: 절감 효과 -->
  <rect x="540" y="60" width="220" height="110" rx="12" fill="#eff6ff"/>
  <text x="650" y="108" text-anchor="middle" font-size="36" font-weight="900" fill="#0f766e">60%↓</text>
  <text x="650" y="148" text-anchor="middle" font-size="13" fill="#6b7280">Grok 4.6이 저렴</text>
</svg>
