<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#92400e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)" />
  <circle cx="700" cy="-50" r="200" fill="white" opacity="0.05"/>
  <circle cx="-30" cy="400" r="160" fill="white" opacity="0.04"/>
  <!-- Tag badge -->
  <rect x="40" y="40" width="100" height="28" rx="14" fill="white" opacity="0.2"/>
  <text x="90" y="59" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="white">홈페이지 제작</text>
  <!-- Checklist card -->
  <rect x="480" y="60" width="280" height="300" rx="20" fill="white" opacity="0.1" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <text x="620" y="140" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="white" text-anchor="middle">회사 홈페이지 만들 때</text>
  <text x="620" y="176" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="white" text-anchor="middle">반드시 확인할 7가지 — 후회</text>
  <text x="620" y="212" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="white" text-anchor="middle">없는 제작을 위한 가이드</text>
  <text x="40" y="265" font-family="Arial, sans-serif" font-size="16" fill="white" opacity="0.75">업체 계약 전 이것만은 꼭!</text>
  <rect x="40" y="310" width="60" height="4" rx="2" fill="white" opacity="0.6"/>
  <text x="40" y="345" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.6">비전솔루션</text>
</svg>
