  <text x="40" y="178" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="white">Wix Symphony</text>
  <text x="40" y="222" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="white">AI 팀장이 사업</text>
  <text x="40" y="262" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="white">다 챙깁니다</text>
  <text x="40" y="305" font-family="Arial, sans-serif" font-size="15" fill="white" opacity="0.75">홍보·마케팅·일정·재무·디자인 전부</text>
