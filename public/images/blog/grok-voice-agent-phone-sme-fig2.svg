<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">도구 비교 — Grok Voice Agent vs Pipecat</text>
  <!-- Grok 카드 -->
  <rect x="40" y="58" width="340" height="115" rx="12" fill="#ecfdf5"/>
  <text x="210" y="88" text-anchor="middle" font-size="15" font-weight="800" fill="#0f766e">Grok Voice Agent (xAI)</text>
  <text x="210" y="110" text-anchor="middle" font-size="13" fill="#1f2937">설정 난이도 ★☆☆☆☆ · 2분</text>
  <text x="210" y="130" text-anchor="middle" font-size="13" fill="#1f2937">비용: $0.05/분 (~70원)</text>
  <text x="210" y="150" text-anchor="middle" font-size="13" fill="#1f2937">무료 전화번호 제공</text>
  <text x="210" y="163" text-anchor="middle" font-size="11" fill="#6b7280">추천: 코딩 모르는 소상공인</text>
  <!-- vs -->
  <text x="400" y="122" text-anchor="middle" font-size="18" font-weight="800" fill="#6b7280">vs</text>
  <!-- Pipecat 카드 -->
  <rect x="420" y="58" width="340" height="115" rx="12" fill="#eff6ff"/>
  <text x="590" y="88" text-anchor="middle" font-size="15" font-weight="800" fill="#1d4ed8">Pipecat (오픈소스)</text>
  <text x="590" y="110" text-anchor="middle" font-size="13" fill="#1f2937">설정 난이도 ★★★☆☆ · 반나절</text>
  <text x="590" y="130" text-anchor="middle" font-size="13" fill="#1f2937">비용: 서버비만 (무료 시작)</text>
  <text x="590" y="150" text-anchor="middle" font-size="13" fill="#1f2937">BSD-2-Clause · GitHub 공개</text>
  <text x="590" y="163" text-anchor="middle" font-size="11" fill="#6b7280">추천: 기술 이해 있는 고급 사용자</text>
</svg>
