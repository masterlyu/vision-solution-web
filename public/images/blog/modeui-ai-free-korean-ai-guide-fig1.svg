  <!-- 마디 3: 12월 (강조) -->
  <circle cx="530" cy="145" r="15" fill="#06b6d4"/>
  <text x="530" y="96" text-anchor="middle" font-size="14" font-weight="800" fill="#0f766e">2026년 12월</text>
  <text x="530" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">'모두의 AI'</text>
