  <circle cx="90" cy="145" r="12" fill="#0f766e"/>
  <text x="90" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">2026년 8월</text>
  <text x="90" y="178" text-anchor="middle" font-size="12" fill="#6b7280">민간기업</text>
  <text x="90" y="196" text-anchor="middle" font-size="12" fill="#6b7280">2~3개사 선정</text>
  <!-- 마디 2: 9월 -->
  <circle cx="310" cy="145" r="12" fill="#0891b2"/>
  <text x="310" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">2026년 9월</text>
  <text x="310" y="178" text-anchor="middle" font-size="12" fill="#6b7280">베타 서비스</text>
