<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f766e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)" />
  <circle cx="700" cy="-50" r="200" fill="white" opacity="0.05"/>
  <circle cx="750" cy="420" r="150" fill="white" opacity="0.05"/>
  <!-- 태그 배지 -->
  <rect x="40" y="40" width="80" height="28" rx="14" fill="white" opacity="0.2"/>
  <text x="80" y="59" text-anchor="middle" font-family="Arial, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="700" fill="white">AI 활용</text>
  <!-- 우측 아이콘 카드 -->
  <rect x="490" y="55" width="270" height="310" rx="20" fill="url(#card1)" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <!-- 문서 아이콘들 -->
  <text x="555" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="white" opacity="0.9">📄</text>
  <text x="625" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="white" opacity="0.9">📊</text>
  <text x="695" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="white" opacity="0.9">📋</text>
  <!-- 화살표 -->
  <text x="625" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="white" opacity="0.6">↓</text>
  <!-- 변환 결과 -->
  <rect x="515" y="190" width="220" height="90" rx="10" fill="white" opacity="0.12"/>
  <text x="625" y="212" text-anchor="middle" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="11" fill="white" opacity="0.7"># 계약서</text>
  <text x="625" y="230" text-anchor="middle" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="11" fill="white" opacity="0.6">계약 기간: 2026-01~2027-01</text>
  <text x="625" y="248" text-anchor="middle" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="11" fill="white" opacity="0.5">| 항목 | 금액 |</text>
  <text x="625" y="266" text-anchor="middle" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="10" fill="white" opacity="0.4">Markdown으로 변환</text>
  <!-- 하단 정보 -->
  <text x="625" y="320" text-anchor="middle" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="13" fill="white" opacity="0.7">Word · PPT · Excel 등 14종</text>
  <text x="625" y="342" text-anchor="middle" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="12" fill="white" opacity="0.5">MIT · 무료 · 오프라인</text>
  <!-- 좌측 메인 텍스트 -->
  <text x="40" y="128" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="14" font-weight="600" fill="white" opacity="0.8">anydoc 5분 실습</text>
  <text x="40" y="178" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="33" font-weight="900" fill="white">오피스 문서 14종</text>
  <text x="40" y="222" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="33" font-weight="900" fill="white">AI에 5분 먹이기</text>
  <text x="40" y="268" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15" fill="white" opacity="0.75">최대 256배 빠른 무료 오픈소스 변환 도구</text>
  <!-- 속도 배지 -->
  <rect x="40" y="288" width="140" height="34" rx="17" fill="white" opacity="0.18"/>
  <text x="110" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="white">⚡ 평균 4.4ms 변환</text>
  <rect x="40" y="352" width="60" height="4" rx="2" fill="white" opacity="0.6"/>
  <text x="40" y="384" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="13" fill="white" opacity="0.6">(주)비젼솔루션</text>
</svg>
