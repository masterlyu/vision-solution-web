<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="240" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">메타 AI가 무료로 해주는 4가지 분석</text>
  <!-- 카드 1 -->
  <rect x="20" y="64" width="175" height="150" rx="12" fill="#f0fdfa"/>
  <text x="107" y="100" text-anchor="middle" font-size="28">📈</text>
  <text x="107" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">게시물 성과 분석</text>
  <text x="107" y="150" text-anchor="middle" font-size="11" fill="#6b7280">도달 · 저장 · 공유</text>
  <text x="107" y="168" text-anchor="middle" font-size="11" fill="#6b7280">댓글 · 프로필 방문</text>
  <!-- 카드 2 -->
  <rect x="210" y="64" width="175" height="150" rx="12" fill="#f0fdfa"/>
  <text x="297" y="100" text-anchor="middle" font-size="28">🎯</text>
  <text x="297" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">광고 최적화</text>
  <text x="297" y="150" text-anchor="middle" font-size="11" fill="#6b7280">타겟 이상 패턴 발견</text>
  <text x="297" y="168" text-anchor="middle" font-size="11" fill="#6b7280">예산 재배분 제안</text>
  <!-- 카드 3 -->
  <rect x="400" y="64" width="175" height="150" rx="12" fill="#f0fdfa"/>
  <text x="487" y="100" text-anchor="middle" font-size="28">🔍</text>
  <text x="487" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">경쟁 브랜드 비교</text>
  <text x="487" y="150" text-anchor="middle" font-size="11" fill="#6b7280">공개 활동 AI 조사</text>
  <text x="487" y="168" text-anchor="middle" font-size="11" fill="#6b7280">업종별 벤치마킹</text>
  <!-- 카드 4 -->
  <rect x="590" y="64" width="190" height="150" rx="12" fill="#f0fdfa"/>
  <text x="685" y="100" text-anchor="middle" font-size="28">📄</text>
  <text x="685" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">보고서 자동 생성</text>
  <text x="685" y="150" text-anchor="middle" font-size="11" fill="#6b7280">Google Docs · Sheets</text>
  <text x="685" y="168" text-anchor="middle" font-size="11" fill="#6b7280">Slides 바로 내보내기</text>
