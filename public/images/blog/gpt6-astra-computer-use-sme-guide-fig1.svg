<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">GPT-6 Astra '컴퓨터 사용' 동작 방식</text>
  <!-- 단계 1 -->
  <rect x="40" y="70" width="200" height="90" rx="12" fill="#0f766e"/>
  <text x="140" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">① 말로 지시</text>
  <text x="140" y="132" text-anchor="middle" font-size="12" fill="#a7f3d0">"○○사이트 가격 찾아줘"</text>
  <!-- 화살표 -->
  <text x="262" y="122" text-anchor="middle" font-size="26" fill="#94a3b8">→</text>
  <!-- 단계 2 -->
  <rect x="300" y="70" width="200" height="90" rx="12" fill="#0891b2"/>
  <text x="400" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">② AI가 브라우저 조작</text>
  <text x="400" y="132" text-anchor="middle" font-size="12" fill="#cffafe">클릭 · 검색 · 입력 직접 수행</text>
  <!-- 화살표 -->
  <text x="522" y="122" text-anchor="middle" font-size="26" fill="#94a3b8">→</text>
  <!-- 단계 3 -->
  <rect x="560" y="70" width="200" height="90" rx="12" fill="#22d3ee"/>
  <text x="660" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#083344">③ 결과 보고</text>
  <text x="660" y="132" text-anchor="middle" font-size="12" fill="#083344">표·요약으로 정리 완료</text>
</svg>
