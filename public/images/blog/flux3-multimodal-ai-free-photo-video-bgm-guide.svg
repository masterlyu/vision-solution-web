<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f766e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)" />
  <circle cx="700" cy="-50" r="200" fill="white" opacity="0.05"/>
  <circle cx="750" cy="420" r="150" fill="white" opacity="0.05"/>
  <!-- 태그 배지 -->
  <rect x="40" y="40" width="100" height="28" rx="14" fill="white" opacity="0.2"/>
  <text x="90" y="59" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="white">생성형 AI</text>
  <!-- 우측 아이콘 카드 -->
  <rect x="490" y="55" width="270" height="310" rx="20" fill="url(#card1)" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <!-- 3개 콘텐츠 타입 아이콘 -->
  <text x="560" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" fill="white" opacity="0.9">📸</text>
  <text x="625" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" fill="white" opacity="0.9">🎬</text>
  <text x="690" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" fill="white" opacity="0.9">🎵</text>
  <text x="625" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.7">사진 · 영상 · BGM</text>
  <!-- 화살표 및 One AI 표시 -->
  <text x="625" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="white" opacity="0.5">↓</text>
  <rect x="545" y="248" width="160" height="36" rx="18" fill="white" opacity="0.2"/>
  <text x="625" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="white">FLUX 3 하나로</text>
  <text x="625" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.5">Black Forest Labs · 2026.07.23</text>
  <!-- 좌측 메인 텍스트 -->
  <text x="40" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white" opacity="0.8">멀티모달 생성 AI</text>
  <text x="40" y="178" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="white">사진·영상·BGM</text>
  <text x="40" y="222" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="white">한 번에 무료로</text>
  <text x="40" y="272" font-family="Arial, sans-serif" font-size="15" fill="white" opacity="0.75">광고 대행사 AI, 이제 우리 회사도 5분 실습</text>
  <rect x="40" y="315" width="60" height="4" rx="2" fill="white" opacity="0.6"/>
  <text x="40" y="350" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.6">(주)비젼솔루션</text>
