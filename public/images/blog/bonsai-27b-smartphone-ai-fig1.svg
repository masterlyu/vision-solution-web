<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">Bonsai 27B — 핵심 성능 수치</text>
  <!-- 카드 1: 용량 -->
  <rect x="40" y="64" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="150" y="125" text-anchor="middle" font-size="36" font-weight="900" fill="#0f766e">3.9GB</text>
  <text x="150" y="155" text-anchor="middle" font-size="13" fill="#6b7280">1비트 모델 · 아이폰 실행 가능</text>
  <!-- 카드 2: 속도 -->
  <rect x="290" y="64" width="220" height="110" rx="12" fill="#ecfeff"/>
  <text x="400" y="125" text-anchor="middle" font-size="36" font-weight="900" fill="#0891b2">11 tok/s</text>
  <text x="400" y="155" text-anchor="middle" font-size="13" fill="#6b7280">아이폰 처리 속도 (1비트 버전)</text>
  <!-- 카드 3: 성능 -->
  <rect x="540" y="64" width="220" height="110" rx="12" fill="#f0fdfa"/>
  <text x="650" y="125" text-anchor="middle" font-size="36" font-weight="900" fill="#0f766e">90~95%</text>
  <text x="650" y="155" text-anchor="middle" font-size="13" fill="#6b7280">풀프리시전 대비 성능 유지</text>
</svg>
