<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">Gemini 3.7 Flash 핵심 수치</text>
  <!-- 카드 1: 가격 인하 -->
  <rect x="40" y="58" width="220" height="118" rx="12" fill="#ccfbf1"/>
  <text x="150" y="118" text-anchor="middle" font-size="38" font-weight="900" fill="#0f766e">50%↓</text>
  <text x="150" y="150" text-anchor="middle" font-size="13" fill="#6b7280">이전 대비 가격 인하</text>
  <text x="150" y="168" text-anchor="middle" font-size="11" fill="#9ca3af">12월 31일까지</text>
  <!-- 카드 2: 코딩 성능 -->
  <rect x="290" y="58" width="220" height="118" rx="12" fill="#cffafe"/>
  <text x="400" y="118" text-anchor="middle" font-size="38" font-weight="900" fill="#0891b2">+9.2%p</text>
  <text x="400" y="150" text-anchor="middle" font-size="13" fill="#6b7280">코딩 성능 향상</text>
  <text x="400" y="168" text-anchor="middle" font-size="11" fill="#9ca3af">FrontierCode 34.4→43.6%</text>
  <!-- 카드 3: 실무 성능 -->
  <rect x="540" y="58" width="220" height="118" rx="12" fill="#dcfce7"/>
  <text x="650" y="118" text-anchor="middle" font-size="38" font-weight="900" fill="#16a34a">+16%p</text>
  <text x="650" y="150" text-anchor="middle" font-size="13" fill="#6b7280">실무 자동화 향상</text>
  <text x="650" y="168" text-anchor="middle" font-size="11" fill="#9ca3af">DeepSWE 49→65.3%</text>
</svg>
