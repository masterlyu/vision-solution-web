<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="300" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">AI 원문 vs. 변환 후 — 문체 비교 (개념 예시)</text>
  <!-- 왼쪽: AI 원문 -->
  <rect x="40" y="58" width="330" height="210" rx="12" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="205" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">❌ AI 원문</text>
  <line x1="60" y1="94" x2="350" y2="94" stroke="#fca5a5" stroke-width="1"/>
  <text x="60" y="118" font-size="12" fill="#374151">저희 제품은 고객 여러분의</text>
  <text x="60" y="138" font-size="12" fill="#374151">업무 효율성을 향상시킬 수</text>
  <text x="60" y="158" font-size="12" fill="#374151">있도록 설계되었으며, 다양한</text>
  <text x="60" y="178" font-size="12" fill="#374151">기능을 통해 생산성을 극대화하고</text>
  <text x="60" y="198" font-size="12" fill="#374151">비용 절감 효과를 기대하실 수</text>
  <text x="60" y="218" font-size="12" fill="#374151">있습니다.</text>
  <text x="60" y="248" font-size="11" fill="#991b1b">→ AI 감지기가 잡아내는 패턴</text>
  <!-- 화살표 -->
  <text x="400" y="170" text-anchor="middle" font-size="32" fill="#0f766e">→</text>
  <!-- 오른쪽: 변환 후 -->
  <rect x="430" y="58" width="330" height="210" rx="12" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="595" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">✅ 변환 후</text>
  <line x1="450" y1="94" x2="740" y2="94" stroke="#6ee7b7" stroke-width="1"/>
  <text x="450" y="118" font-size="12" fill="#374151">이 제품, 직접 써본 분들이</text>
  <text x="450" y="138" font-size="12" fill="#374151">가장 먼저 하는 말이 있습니다.</text>
  <text x="450" y="158" font-size="12" fill="#374151">'생각보다 빠르네요.'</text>
  <text x="450" y="178" font-size="12" fill="#374151">설명보다 한번 보시면</text>
  <text x="450" y="198" font-size="12" fill="#374151">바로 납득이 가실 겁니다.</text>
  <text x="450" y="248" font-size="11" fill="#065f46">→ 자연스러운 사람 문체</text>
</svg>
