<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="220" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">섀도 AI 설문 핵심 3가지 (IT·보안 담당자 151명)</text>
  <rect x="40" y="64" width="220" height="130" rx="12" fill="#f5f3ff"/>
  <text x="150" y="118" text-anchor="middle" font-size="36" font-weight="900" fill="#7c3aed">77.3%</text>
  <text x="150" y="146" text-anchor="middle" font-size="14" fill="#6b7280">전면 차단 기업의</text>
  <text x="150" y="166" text-anchor="middle" font-size="14" fill="#6b7280">개인 계정 AI 사용률</text>
  <rect x="290" y="64" width="220" height="130" rx="12" fill="#f5f3ff"/>
  <text x="400" y="118" text-anchor="middle" font-size="36" font-weight="900" fill="#7c3aed">19.2%</text>
  <text x="400" y="146" text-anchor="middle" font-size="14" fill="#6b7280">개인 계정 AI 사용을</text>
  <text x="400" y="166" text-anchor="middle" font-size="14" fill="#6b7280">파악·통제하는 조직</text>
  <rect x="540" y="64" width="220" height="130" rx="12" fill="#f5f3ff"/>
  <text x="650" y="118" text-anchor="middle" font-size="36" font-weight="900" fill="#7c3aed">28.5%</text>
  <text x="650" y="146" text-anchor="middle" font-size="14" fill="#6b7280">몰래 쓰는 1위 이유</text>
  <text x="650" y="166" text-anchor="middle" font-size="14" fill="#6b7280">사용 정책·지침 부재</text>
</svg>
