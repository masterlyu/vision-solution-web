<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="Arial, 'Malgun Gothic', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f766e"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <!-- Waveform decoration top -->
  <path d="M0 200 Q50 140 100 200 Q150 260 200 200 Q250 140 300 200 Q350 260 400 200 Q450 140 500 200 Q550 260 600 200 Q650 140 700 200 Q750 260 800 200" stroke="rgba(255,255,255,0.12)" stroke-width="3" fill="none"/>
  <path d="M0 230 Q50 170 100 230 Q150 290 200 230 Q250 170 300 230 Q350 290 400 230 Q450 170 500 230 Q550 290 600 230 Q650 170 700 230 Q750 290 800 230" stroke="rgba(255,255,255,0.07)" stroke-width="2" fill="none"/>
  <!-- Tag badge -->
  <rect x="40" y="44" width="110" height="28" rx="14" fill="rgba(255,255,255,0.2)"/>
  <text x="95" y="63" text-anchor="middle" font-size="13" font-weight="700" fill="white">AI 음성 복제</text>
  <!-- Main headline -->
  <text x="40" y="130" font-size="38" font-weight="900" fill="white">내 목소리 복제 AI</text>
  <text x="40" y="178" font-size="24" font-weight="600" fill="rgba(255,255,255,0.88)">ElevenLabs보다 좋은데 무료입니다</text>
  <!-- Stats cards -->
  <rect x="40" y="250" width="170" height="100" rx="14" fill="rgba(255,255,255,0.16)"/>
  <text x="125" y="302" text-anchor="middle" font-size="34" font-weight="900" fill="white">65.3%</text>
  <text x="125" y="333" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.82)">블라인드 테스트 선호도</text>

  <rect x="230" y="250" width="150" height="100" rx="14" fill="rgba(255,255,255,0.16)"/>
  <text x="305" y="302" text-anchor="middle" font-size="34" font-weight="900" fill="white">5초</text>
  <text x="305" y="333" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.82)">녹음으로 복제</text>

  <rect x="400" y="250" width="150" height="100" rx="14" fill="rgba(255,255,255,0.16)"/>
  <text x="475" y="302" text-anchor="middle" font-size="34" font-weight="900" fill="white">무료</text>
  <text x="475" y="333" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.82)">MIT 오픈소스</text>

  <rect x="570" y="250" width="190" height="100" rx="14" fill="rgba(255,255,255,0.16)"/>
  <text x="665" y="302" text-anchor="middle" font-size="34" font-weight="900" fill="white">23개 언어</text>
  <text x="665" y="333" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.82)">한국어 포함</text>

  <!-- Footer -->
  <text x="40" y="400" font-size="13" fill="rgba(255,255,255,0.5)">Chatterbox TTS by Resemble AI · MIT License · github.com/resemble-ai/chatterbox</text>
  <text x="760" y="400" text-anchor="end" font-size="13" fill="rgba(255,255,255,0.45)">(주)비젼솔루션</text>
