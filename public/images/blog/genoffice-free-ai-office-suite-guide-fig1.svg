<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="800" height="200" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="800" fill="#1f2937">GenOffice 핵심 3가지</text>
  <!-- 카드 1: 무료 -->
  <rect x="40" y="64" width="220" height="110" rx="12" fill="#ecfdf5"/>
  <text x="150" y="118" text-anchor="middle" font-size="36" font-weight="900" fill="#0f766e">무료</text>
  <text x="150" y="150" text-anchor="middle" font-size="13" fill="#6b7280">광고·구독료 없음</text>
  <!-- 카드 2: 4종 앱 -->
  <rect x="290" y="64" width="220" height="110" rx="12" fill="#ecfdf5"/>
  <text x="400" y="118" text-anchor="middle" font-size="36" font-weight="900" fill="#0f766e">4종</text>
  <text x="400" y="150" text-anchor="middle" font-size="13" fill="#6b7280">문서·엑셀·PPT·PDF</text>
  <!-- 카드 3: 1주일 -->
  <rect x="540" y="64" width="220" height="110" rx="12" fill="#ecfdf5"/>
  <text x="650" y="118" text-anchor="middle" font-size="36" font-weight="900" fill="#0f766e">1주일</text>
  <text x="650" y="150" text-anchor="middle" font-size="13" fill="#6b7280">알파 버전 개발 기간</text>
</svg>
