<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#92400e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)" />
  <circle cx="700" cy="-50" r="200" fill="white" opacity="0.05"/>
  <circle cx="750" cy="420" r="150" fill="white" opacity="0.05"/>
  <!-- 태그 배지 -->
  <rect x="40" y="40" width="130" height="28" rx="14" fill="white" opacity="0.2"/>
  <text x="105" y="59" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="white">소상공인 마케팅</text>
  <!-- 우측 아이콘 카드 -->
  <rect x="480" y="60" width="280" height="300" rx="20" fill="url(#card1)" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <text x="620" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="80" fill="white" opacity="0.9">💬</text>
  <text x="620" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="white" opacity="0.7">카카오 비즈니스 채널</text>
  <text x="620" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.5">business.kakao.com</text>
  <!-- 좌측 메인 텍스트 -->
  <text x="40" y="130" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="white" opacity="0.8">소상공인 마케팅 가이드</text>
  <text x="40" y="175" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="white">카카오채널</text>
  <text x="40" y="215" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="white">30분 완성 가이드</text>
  <text x="40" y="265" font-family="Arial, sans-serif" font-size="15" fill="white" opacity="0.75">월 0원으로 단골 손님 만드는 법</text>
  <!-- 포인트 배지 3개 -->
  <rect x="40" y="290" width="90" height="28" rx="6" fill="white" opacity="0.15"/>
  <text x="85" y="309" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">챗봇 무료</text>
  <rect x="140" y="290" width="100" height="28" rx="6" fill="white" opacity="0.15"/>
  <text x="190" y="309" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">30만원 지원</text>
  <rect x="250" y="290" width="110" height="28" rx="6" fill="white" opacity="0.15"/>
  <text x="305" y="309" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">전환율 40% ↑</text>
  <rect x="40" y="340" width="60" height="4" rx="2" fill="white" opacity="0.6"/>
  <text x="40" y="375" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.6">(주)비젼솔루션</text>
</svg>
