name: Deploy Notify

on:
  push:
    branches: [main]

jobs:
  notify:
    name: Wait for Vercel and report honestly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Vercel deployment status
        id: vercel
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const maxTries = 30;
            const delay = 15000;

            for (let i = 0; i < maxTries; i++) {
              const deployments = await github.rest.repos.listDeployments({
                owner, repo, sha, per_page: 10,
              });
              const vercelDeploys = deployments.data.filter(d =>
                (d.creator && d.creator.login && d.creator.login.toLowerCase().includes('vercel'))
                || d.environment.toLowerCase().includes('production')
                || d.environment.toLowerCase().includes('preview')
              );

              for (const d of vercelDeploys) {
                const statuses = await github.rest.repos.listDeploymentStatuses({
                  owner, repo, deployment_id: d.id, per_page: 5,
                });
                const latest = statuses.data[0];
                if (!latest) continue;
                core.info(`Deployment ${d.id} (${d.environment}) state=${latest.state}`);
                if (['success', 'failure', 'error', 'inactive'].includes(latest.state)) {
                  core.setOutput('state', latest.state);
                  core.setOutput('env', d.environment);
                  core.setOutput('url', latest.target_url || latest.environment_url || '');
                  return;
                }
              }
              await new Promise(r => setTimeout(r, delay));
            }
            core.setOutput('state', 'timeout');
            core.setOutput('env', 'unknown');
            core.setOutput('url', '');

      - name: Telegram — success
        if: steps.vercel.outputs.state == 'success'
        env:
          TG_BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ENVIRONMENT: ${{ steps.vercel.outputs.env }}
          DEPLOY_URL: ${{ steps.vercel.outputs.url }}
        run: |
          TEXT="✅ Vercel 배포 성공 (${ENVIRONMENT})
          ${COMMIT_MSG}
          🌐 https://www.visionc.co.kr
          🔗 ${DEPLOY_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${TEXT}"

      # 바뀐 블로그 글 주소를 IndexNow 로 알린다 (빙·네이버·얀덱스가 받아 빨리 수집). 구글은 미지원 — 사이트맵으로.
      # 열쇠 파일: public/e286259e7b6e2308da804cde3f41fd52.txt (공개가 정상 — 사이트 소유 확인용). 알림 실패는 배포 실패가 아니므로 경고만 남긴다.
      - name: IndexNow — 바뀐 블로그 글 알림
        if: steps.vercel.outputs.state == 'success' && contains(steps.vercel.outputs.env, 'production')
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          KEY=e286259e7b6e2308da804cde3f41fd52
          FILES=$(gh api "repos/${{ github.repository }}/compare/${BEFORE}...${{ github.sha }}" --jq '.files[] | select(.status != "removed") | .filename' | grep -E '^content/blog/[^/]+\.mdx?$' || true)
          if [ -z "$FILES" ]; then echo "바뀐 글 없음"; exit 0; fi
          URLS=$(echo "$FILES" | sed -E 's#^content/blog/(.+)\.mdx?$#"https://visionc.co.kr/blog/\1"#' | paste -sd, -)
          BODY="{\"host\":\"visionc.co.kr\",\"key\":\"$KEY\",\"keyLocation\":\"https://visionc.co.kr/$KEY.txt\",\"urlList\":[$URLS]}"
          echo "$BODY"
          CODE=$(curl -s -o /tmp/indexnow.out -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$BODY" || true)
          echo "IndexNow 응답 $CODE"; cat /tmp/indexnow.out
          case "$CODE" in 200|202) ;; *) echo "::warning::IndexNow 응답 $CODE" ;; esac

      - name: Telegram — failure
        if: steps.vercel.outputs.state == 'failure' || steps.vercel.outputs.state == 'error'
        env:
          TG_BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ENVIRONMENT: ${{ steps.vercel.outputs.env }}
          DEPLOY_URL: ${{ steps.vercel.outputs.url }}
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA=$(echo "$SHA" | cut -c1-7)
          TEXT="❌ Vercel 배포 실패 (${ENVIRONMENT})
          커밋: ${SHORT_SHA}
          ${COMMIT_MSG}
          🔗 로그: ${DEPLOY_URL}
          ⚠ 실사이트 미반영 — 즉시 확인 필요"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${TEXT}"
          exit 1

      - name: Telegram — timeout
        if: steps.vercel.outputs.state == 'timeout'
        env:
          TG_BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA=$(echo "$SHA" | cut -c1-7)
          TEXT="⏱ Vercel 배포 상태 확인 타임아웃
          커밋: ${SHORT_SHA}
          7.5분 이내 상태 미결정 — Vercel 대시보드 직접 확인 필요"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${TEXT}"
